version: 1
sources:
  - {id: vehicle, type: local, file: local_motion.yaml}
  - {id: comparison, type: local, file: local_motion.yaml}
selected_source: vehicle
fixed_frame: world
camera: {target: [1, 0, 0], yaw: 0.8, pitch: 0.65, distance: 16}
displays:
  - {id: Grid, type: grid, color: [45, 65, 80]}
  - {id: Vehicle pose, type: pose, source: vehicle, stream: pose, max_age_ns: 300000000, scale: 0.5}
  - {id: Trajectory, type: trajectory, source: vehicle, stream: pose, history_limit: 1000}
  - {id: Instrument frame, type: axes, source: vehicle, frame: instrument, scale: 0.7}
  - {id: Comparison pose, type: pose, source: comparison, stream: pose, max_age_ns: 300000000, scale: 0.5}
  - {id: Comparison trajectory, type: trajectory, source: comparison, stream: pose}
