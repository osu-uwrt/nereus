name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libgtest-dev clang-tidy
          python3 -m pip install clang-format==23.1.1
      - name: Check
        run: python3 tools/check.py --preset ${{ matrix.preset }} --tidy
      - name: Verify minimal plant build
        if: matrix.preset == 'release'
        run: |
          cmake --preset plant-only
          cmake --build --preset plant-only
  python:
    # Pack tools: lint, types, tests, and an installed wheel validating the Talos scenario.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install tools
        run: python -m pip install 'numpy>=1.23,<3' 'ruamel.yaml>=0.18,<0.20' 'jsonschema>=4.21,<5' 'referencing>=0.34,<1' 'build>=1.2,<2' 'mypy>=1.11,<2' 'ruff>=0.9,<1' pytest setuptools wheel
      - name: Check
        run: python tools/check_python.py

  ros:
    # What the team runs: nereus-sim, nereus-viewer and the packs, against ROS 2 Humble.
    runs-on: ubuntu-22.04
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y cmake g++ libeigen3-dev libyaml-cpp-dev nlohmann-json3-dev libgtest-dev \
            libbullet-dev libassimp-dev libglfw3-dev libglew-dev libegl-dev libgl1-mesa-dev libpng-dev \
            libjpeg-dev libopencv-dev xvfb xauth python3-pip ros-humble-robot-localization
          python3 -m pip install numpy "ruamel.yaml>=0.18,<0.20" "jsonschema>=4.21,<5" "referencing>=0.34,<1" pytest
      - name: Build riptide_msgs2
        run: |
          git clone --depth 1 https://github.com/osu-uwrt/riptide_core /tmp/ws/src/riptide_core
          . /opt/ros/humble/setup.sh
          cd /tmp/ws && colcon build --packages-select riptide_msgs2
      - name: Validate packs
        run: PYTHONPATH=python/src python3 -m nereus.packs validate content/packs/scenarios/talos_uwrt
      - name: Build
        run: |
          . /opt/ros/humble/setup.sh && . /tmp/ws/install/setup.sh
          cmake --preset ros-viewer
          cmake --build --preset ros-viewer -j2
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          . /opt/ros/humble/setup.sh && . /tmp/ws/install/setup.sh
          xvfb-run -a ctest --test-dir build/ros-viewer -LE live -j2 --output-on-failure
          cd tests/python && PYTHONPATH=../../python/src python3 -m pytest -q
