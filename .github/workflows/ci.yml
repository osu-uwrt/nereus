name: build-and-test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libyaml-cpp-dev libgtest-dev clang-tidy
          python3 -m pip install clang-format==23.1.1
      - name: Check
        run: python3 tools/check.py --preset ${{ matrix.preset }} --install-check --tidy
      - name: Verify minimal plant build
        if: matrix.preset == 'release'
        run: |
          cmake --preset plant-only
          cmake --build --preset plant-only
  python:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        sanitizers: [false, true]
    steps:
      - uses: actions/checkout@v4
      - name: Install native and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libeigen3-dev libyaml-cpp-dev python3-dev python3-venv clang-tidy
          python3 -m venv /tmp/robotics-python-tools
          /tmp/robotics-python-tools/bin/pip install 'scikit-build-core>=0.11,<1.1' 'pybind11>=2.13,<4' 'build>=1.2,<2' 'ninja>=1.5' 'mypy>=1.11,<2' 'ruff>=0.9,<1' 'numpy>=1.23,<3'
      - name: Build C++ reference runner
        run: |
          cmake -S . -B build/reference -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/reference --parallel 2
      - name: Check wheel and installed API
        env:
          SANITIZERS: ${{ matrix.sanitizers }}
        run: |
          flags=()
          if [ "$SANITIZERS" = true ]; then flags+=(--sanitizers); fi
          /tmp/robotics-python-tools/bin/python tools/check_python.py --tidy --reference-runner build/reference/robotics-sim "${flags[@]}"
