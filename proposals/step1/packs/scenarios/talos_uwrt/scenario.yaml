assets: []

robot: ../../robots/talos
pool: ../../pools/robosub_2026
tasks: ../../tasks/robosub_2026
bridge: ../../bridges/uwrt_talos

seed: 7                      # original random_seed default
timestep_ns: 2000000         # 2 ms physics_step
sensor_noise: true

# World = original "map": ENU, +Z up, z = 0 at the water surface. All placements are upright
# (yaw about world +Z only), stored in source degrees so no hand-rounded angles appear.
world_frame: map

# Pool corner pose in world. Source map_origin_pool [x 19.5136, y 0, yaw 90 deg] is the map origin
# in pool coordinates; its exact inverse is position [0, 19.5136, 0], yaw -90 deg.
# (Native talos_navigation_pool.yaml stores the same pose with -1.19e-15 floating noise in x.)
pool_placement:
  position_m: [0.0, 19.5136, 0.0]
  yaw_deg: -90.0

# Original mapping init_data (parent map), copied verbatim. Same values are the robot's prior map
# (riptide_mapping2 config.yaml): trap T1.
task_placements:
- {task: gate, position_m: [4.810167, -2.217889, -0.75], yaw_deg: 170.645069}
- {task: torpedo, position_m: [18.35222, 2.480545, -1.372], yaw_deg: -169.835651}

contacts:
  model: box_scene
  restitution: 0.1
  friction: 0.4

# Plant state at the COM (native state frame), body-axis velocities. base_link starts at
# [0.017, -0.01, -1.042] (COM + base_link offset). Kill/arm defaults are robot.safety.
initial:
  frame: com
  position_m: [0, 0, -1]               # original startup state (talos.yaml has no sim_start_pose)
  orientation_wxyz: [1, 0, 0, 0]
  linear_velocity_m_s: [0, 0, 0]
  angular_velocity_rad_s: [0, 0, 0]

run:
  auto_start: true                      # original starts via operator run_command "start"
  options: {role: repair, heading_coin: true, role_coin: true, pinger_task: none, pinger_random: false}

