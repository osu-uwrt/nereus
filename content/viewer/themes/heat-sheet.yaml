# A swim meet's results sheets and the pool timing board: white sheets on rule-gray ground, ink type, ruled heads,
# an ink board with amber figures; lane blue for selection and "on", go green for Enable, touch red for KILL.
id: heat-sheet
label: Heat sheet
description: "Results-sheet white with an ink board: the default, for the pool deck"
order: 0
fonts: {points: 12, regular: BarlowTF-Regular.ttf, strong: BarlowTF-SemiBold.ttf, figures: BarlowTF-SemiCondensedBold.ttf}
