# Talos rotor animation for the ROS pool viewer, driven by realized thruster forces (newtons).
# Pivots/axes are in the CAD origin frame (the robot pack `cad` frame) where each rotor asset is authored;
# `thruster` names a robot-pack thruster id (force-array index comes from the bridge thrusters.order),
# `asset` a robot-pack asset id (rotor meshes are already listed in the pack visuals).
# Signed RPM = c0 + c1*F + c2*tanh(F) + c3*abs(F)^0.25, separate forward/reverse fits, clamped at idle.
schema_version: 1
topic: simulator/actual_thruster_forces
timeout: 0.5
force_deadband: 0.01
speed_scale: 1.0          # 1 = real-time estimated RPM; no display speed cap
force_to_rpm:
  forward: [-475.886186, 32.327429, -324.744664, 1443.832105]
  reverse: [257.460623, 42.948545, -24.402056, -986.338071]
rotors:
  - {id: VUS, thruster: VUS, asset: rotor_VUS, frame: cad, pivot: [-0.134, -0.37158089, 0.24382236], axis: [1.0, 0.0, 0.0], direction: -1}
  - {id: VUP, thruster: VUP, asset: rotor_VUP, frame: cad, pivot: [-0.134, 0.43998086, 0.24382232], axis: [1.0, 0.0, 0.0], direction: 1}
  - {id: HUS, thruster: HUS, asset: rotor_HUS, frame: cad, pivot: [-0.13982523, -0.2597391, 0.1407391], axis: [0.0, 0.70710678, 0.70710678], direction: 1}
  - {id: HUP, thruster: HUP, asset: rotor_HUP, frame: cad, pivot: [-0.13982472, 0.32793908, 0.14093908], axis: [0.0, -0.70710678, 0.70710678], direction: -1}
  - {id: HLS, thruster: HLS, asset: rotor_HLS, frame: cad, pivot: [-0.13962457, -0.25980261, -0.14080261], axis: [0.0, 0.70710678, -0.70710678], direction: -1}
  - {id: HLP, thruster: HLP, asset: rotor_HLP, frame: cad, pivot: [-0.13962401, 0.32800257, -0.14100257], axis: [0.0, -0.70710678, -0.70710678], direction: 1}
  - {id: VLS, thruster: VLS, asset: rotor_VLS, frame: cad, pivot: [-0.134, -0.37170786, -0.24382233], axis: [1.0, 0.0, 0.0], direction: 1}
  - {id: VLP, thruster: VLP, asset: rotor_VLP, frame: cad, pivot: [-0.134, 0.44010785, -0.24382233], axis: [1.0, 0.0, 0.0], direction: -1}
