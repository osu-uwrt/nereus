# Talos rotor animation for the ROS pool viewer, driven by realized thruster forces (newtons).
# Pivots/axes are in the CAD origin frame (the robot pack `origin` frame) where each rotor asset is authored;
# `thruster` names a robot-pack thruster id (force-array index comes from the bridge thrusters.order),
# `asset` a robot-pack asset id (rotor meshes are already listed in the pack visuals).
# Rotor speed inverts the propeller law |F| = K_T * water_density * D^4 * (rpm/60)^2, K_T = a + b*rpm per direction:
# the Blue Robotics T200 fit riptide_mpc models/talos.yaml uses (hardware.thrust_coefficient_*).
topic: simulator/actual_thruster_forces
timeout: 0.5
force_deadband: 0.01
speed_scale: 1.0          # 1 = real-time estimated RPM; no display speed cap
propeller:
  diameter_m: 0.076
  water_density: 998.2
  thrust_coefficient_forward: [0.3964, 1.48e-5]
  thrust_coefficient_reverse: [0.3114, 1.25e-5]
rotors:
  - {id: VUS, thruster: VUS, asset: rotor_VUS, frame: origin, pivot: [-0.134, -0.37158089, 0.24382236], axis: [1.0, 0.0, 0.0], direction: -1}
  - {id: VUP, thruster: VUP, asset: rotor_VUP, frame: origin, pivot: [-0.134, 0.43998086, 0.24382232], axis: [1.0, 0.0, 0.0], direction: 1}
  - {id: HUS, thruster: HUS, asset: rotor_HUS, frame: origin, pivot: [-0.13982523, -0.2597391, 0.1407391], axis: [0.0, 0.70710678, 0.70710678], direction: 1}
  - {id: HUP, thruster: HUP, asset: rotor_HUP, frame: origin, pivot: [-0.13982472, 0.32793908, 0.14093908], axis: [0.0, -0.70710678, 0.70710678], direction: -1}
  - {id: HLS, thruster: HLS, asset: rotor_HLS, frame: origin, pivot: [-0.13962457, -0.25980261, -0.14080261], axis: [0.0, 0.70710678, -0.70710678], direction: -1}
  - {id: HLP, thruster: HLP, asset: rotor_HLP, frame: origin, pivot: [-0.13962401, 0.32800257, -0.14100257], axis: [0.0, -0.70710678, -0.70710678], direction: 1}
  - {id: VLS, thruster: VLS, asset: rotor_VLS, frame: origin, pivot: [-0.134, -0.37170786, -0.24382233], axis: [1.0, 0.0, 0.0], direction: 1}
  - {id: VLP, thruster: VLP, asset: rotor_VLP, frame: origin, pivot: [-0.134, 0.44010785, -0.24382233], axis: [1.0, 0.0, 0.0], direction: -1}
