          - command/simple_dropper_fire
          # Autonomy, perception, mapping
          - autonomy/tree_stack
          - state/mapping
          - detected_objects
          - detections
          - yolo_orientation/annotated/compressed
          - yolo_orientation/visualization_marker_array
          - yolo_orientation/point_cloud
          - mapping/bandage
          - mapping/bin
          - mapping/bin_cad_geometry
          - mapping/bin_target1
          - mapping/bin_target2
          - mapping/bin_vinyl1
          - mapping/bin_vinyl2
          - mapping/bin_vinyl3
          - mapping/bin_vinyl4
          - mapping/blood_hole_large
          - mapping/blood_hole_small
          - mapping/buoy
          - mapping/compass
          - mapping/fire_hole_large
          - mapping/fire_hole_small
          - mapping/fused
          - mapping/gate
          - mapping/gate_repair
          - mapping/gate_rescue
          - mapping/hammer_and_wrench
          - mapping/helmet
          - mapping/magnet1
          - mapping/magnet2
          - mapping/magnet_target1
          - mapping/magnet_target2
          - mapping/nut_and_bolt
          - mapping/octagon
          - mapping/pill
          - mapping/plug
          - mapping/post_bin_pose
          - mapping/post_table_pose
          - mapping/pre_bin_pose
          - mapping/pre_return_home
          - mapping/pre_table_pose
          - mapping/pre_torpedo_pose
          - mapping/prequal_gate
