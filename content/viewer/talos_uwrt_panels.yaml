          - controller/motion_enabled
          - controller/scale/trust
          - controller/mpc/state
          - controller/mpc/reference
          - controller/mpc/disturbance
          - controller/mpc/solve_time_ms
          - controller/mpc/planned_path
          - controller/mpc/predicted_path
          - controller/active_body_force
          - controller/FF_body_force
          - controller/stunt_state
          - controller_debug_wrench
          - thruster_forces
          - command/requested_rpm
          - command/thruster_rpm
          - state/thrusters/cmd
          - state/thrusters/rpm
          - state/thrusters/telemetry
          # Safety, power, actuators
          - state/kill
          - command/software_kill
          - control/software_kill
          - state/physkill_notify
          - state/leak
          - state/battery
          - state/batteries_balanced
          - state/electrical
          - state/aux
          - state/firmware
          - state/fw_heartbeat
          - state/temp/cameracage
          - state/temp/poacboard
          - state/humidity/cameracage
          - state/humidity/poacboard
          - command/electrical
          - command/led
          - state/actuator/status
          - state/actuator/busy
          - state/actuator/cmd_feedback
          - state/actuator/cmd_status
          - state/actuator/dynamixel
          - command/actuator/arm
