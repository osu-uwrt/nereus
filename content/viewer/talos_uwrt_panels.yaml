          - mapping/slalom_back
          - mapping/slalom_front
          - mapping/slalom_middle
          - mapping/slalom_parent
          - mapping/sos
          - mapping/table
          - mapping/torpedo
          - mapping/warning
          # Cameras: compressed color, calibration, depth
          - ffc/zed_node/left/image_rect_color/compressed
          - ffc/zed_node/left/camera_info
          - ffc/zed_node/depth/camera_info
          - ffc/zed_node/depth/depth_registered
          - ffc/zed_node/depth/depth_info
          - ffc/zed_node/imu/data
          - ffc/zed_node/status/health
          - ffc/zed_node/status/svo
          - ffc/zed_node/temperature/imu
          - dfc/zed_node/left/image_rect_color/compressed
          - dfc/zed_node/left/camera_info
          - dfc/zed_node/depth/camera_info
          - dfc/zed_node/depth/depth_registered
          - dfc/zed_node/depth/depth_info
          - dfc/zed_node/imu/data
          - dfc/zed_node/status/health
          - dfc/zed_node/status/svo
          - dfc/zed_node/temperature/imu
          # Acoustics
          - ivc/pinger/enable
          - ivc/pinger/selected_freq_khz
          - ivc/pinger/selected_freq_amp_stream
          - acoustics/buffer_0_closer
          - ivc/rx
