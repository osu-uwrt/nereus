# Talos UWRT operator panels and tools.
# provider run/profile "task" refers to the host-supplied document "task" (task pack ui block).
sidebar_width_fraction: 0.29
providers:
  motion:
    type: uwrt.motion
    options:
      base_frame: "{namespace}/base_link"
      command_frame: world
      setpoint_frame: ghost/base_link
      linear_topic: controller/linear
      angular_topic: controller/angular
      kill_topic: command/software_kill
      kill_state_topic: state/kill
      mode_service: setTeleop
      kill_switch_id: 1
  mission:
    type: uwrt.autonomy
    options:
      action: autonomy/run_tree
      list_service: autonomy/list_trees
      stack_topic: autonomy/tree_stack
  mapping:
    type: uwrt.mapping
    options:
      calibration_action: map/model_tf
      reset_service: mapping/reset_mapping
      target_service: mapping_target
      status_topic: state/mapping
  actuators:
    type: uwrt.actuators
    options:
      status_topic: state/actuator/status
      commands:
        - {id: arm, label: Arm actuators, armed_label: Disarm, topic: command/actuator/arm, type: bool, toggle_armed: true}
        - {id: torpedo, label: Fire torpedo, topic: command/actuator/torpedo, type: empty, requires_armed: true}
        - {id: dropper, label: Drop marker, topic: command/actuator/dropper, type: empty, requires_armed: true}
        - {id: open_claw, label: Open claw, topic: command/actuator/claw, type: bool, value: true, requires_armed: true}
        - {id: close_claw, label: Close claw, topic: command/actuator/claw, type: bool, value: false, requires_armed: true}
        - {id: stop_claw, label: Stop claw, topic: command/actuator/claw_move_s, type: float32, value: 0, requires_armed: true}
        - {id: reload, label: Reload / disarm, topic: command/actuator/notify_reload, type: empty}
  telemetry:
    type: uwrt.telemetry
    options:
      # Thresholds as the RViz diagnostic overlay; timeouts as its gyro (2 s), diagnostics and battery (10 s)
      # watchdogs. Battery: state of charge (warn/error below the percentage), one reading per side.
      readings:
        - {id: fog, label: FOG, source: gyro_status, topic: gyro/status, warn_c: 55, error_c: 75, timeout: 2}
        - {id: cpu, label: CPU, source: diagnostic, topic: /diagnostics_agg,
           status: "/Robot Diagnostics/Computers/Core Temperature", warn_c: 70, error_c: 85, timeout: 10}
        - {id: port, label: PORT, source: battery, topic: state/battery, side: port, warn_pct: 50, error_pct: 20, timeout: 10}
        - {id: stbd, label: STBD, source: battery, topic: state/battery, side: stbd, warn_pct: 50, error_pct: 20, timeout: 10}
  recording:
    type: uwrt.recording
    options:
      cameras:
        - {id: ffc, label: FFC, start_service: ffc/zed_node/start_svo_rec, stop_service: ffc/zed_node/stop_svo_rec}
        - {id: dfc, label: DFC, start_service: dfc/zed_node/start_svo_rec, stop_service: dfc/zed_node/stop_svo_rec}
      capture_service: capture_image
  run:
    type: sim.run
    options:
      profile: task
      command_topic: simulator/run_command
      score_topic: simulator/run_score
      task_score_topic: simulator/task_score
      events_topic: simulator/task_events
      lights_topic: simulator/magnet_lights
      joints_topic: simulator/claw_joints
      reset_topic: simulator/reset_tasks
  simulation:
    type: ros.simulation_rate
    options:
      node: physics_simulator
      parameter: real_time_factor
      max_rate: 10
      sync_service: sync_sim_to_estimate
      reset_service: reset_sim_to_start
panels:
  - id: control
    type: motion
    title: Motion
    provider: motion
    options:
      dive_z: -0.75
  - id: mapping
    type: mapping
    title: Mapping
    provider: mapping
    open: false
    options: {parent_frame: world, tag_frame: estimated_origin_frame, samples: 10}
  - {id: detections, type: detections, title: Vision, open: false}
  - id: cameras
    type: recording
    title: Cameras
    provider: recording
    open: false
    options: {path: "~/svos/run", home: /home/ros, timestamp: true}
  - id: actuators
    type: actuators
    title: Actuators
    provider: actuators
    open: false
  - id: mission
    type: autonomy
    title: Autonomy
    provider: mission
overlays:
  - id: target
    type: pose_gizmo
    title: Robot controls
    provider: motion
    options:
      size_metres: 0.3
      hit_pixels: 20
# Top bar, in order. Types: host items (scene_settings, pool_viewer, panels_menu, view, focus, follow, labels, tf,
# detections, mpc_path, thrust, preview_task) and provider-backed tools (run, simulation; these name a provider).
# Detection settings live in the sidebar "Vision" panel; add `- {type: detections}` here for a compact toggle.
toolbar:
  - {type: scene_settings}
  - {id: simulation, type: simulation, provider: simulation}
  - {type: pool_viewer}
  - {type: panels_menu}
  - {type: view}
  - {type: focus}
  - {type: follow}
  - {type: labels}
  - {type: tf}
  - {type: mpc_path}
  - {type: thrust}
  - {id: run, type: run, provider: run, options: {profile: task}}
  - {type: preview_task}
# Header row, right-aligned beside the pose-source pill: always visible. Toolbar item types (provider-backed
# ones draw their compact form): robot temperatures, and a REC chip per camera while it records.
header:
  - {id: telemetry, type: telemetry, provider: telemetry}
  - {id: recording, type: recording, provider: recording}
ownership:
  - motion: motion
    autonomy: mission
