# Talos UWRT operator panels and tools.
# provider run/profile "task" refers to the host-supplied document "task" (task pack ui block).
# Every panel is a dockable window. `dock:` places it in the built-in layouts (left_top, left, right,
# right_bottom, bottom, floating); panels sharing an area are tabs, `open: false` ones behind the others.
# `visible: false` starts it closed (Windows menu). The operator's own arrangement is saved per user.
# Width of the left dock column in the Standard layout, as a fraction of the window.
sidebar_width_fraction: 0.24
providers:
  motion:
    type: uwrt.motion
    options:
      base_frame: "{namespace}/base_link"
      command_frame: world
      setpoint_frame: ghost/base_link
      linear_topic: controller/linear
      angular_topic: controller/angular
      kill_topic: command/software_kill
      kill_state_topic: state/kill
      mode_service: setTeleop
      kill_switch_id: 1
  mission:
    type: uwrt.autonomy
    options:
      action: autonomy/run_tree
      list_service: autonomy/list_trees
      stack_topic: autonomy/tree_stack
  mapping:
    type: uwrt.mapping
    options:
      calibration_action: map/model_tf
      reset_service: mapping/reset_mapping
      target_service: mapping_target
      status_topic: state/mapping
  actuators:
    type: uwrt.actuators
    options:
      status_topic: state/actuator/status
      commands:
        - {id: arm, label: Arm actuators, armed_label: Disarm, topic: command/actuator/arm, type: bool, toggle_armed: true}
        - {id: torpedo, label: Fire torpedo, topic: command/actuator/torpedo, type: empty, requires_armed: true}
        - {id: dropper, label: Drop marker, topic: command/actuator/dropper, type: empty, requires_armed: true}
        - {id: open_claw, label: Open claw, topic: command/actuator/claw, type: bool, value: true, requires_armed: true}
        - {id: close_claw, label: Close claw, topic: command/actuator/claw, type: bool, value: false, requires_armed: true}
        - {id: stop_claw, label: Stop claw, topic: command/actuator/claw_move_s, type: float32, value: 0, requires_armed: true}
        - {id: reload, label: Reload / disarm, topic: command/actuator/notify_reload, type: empty}
  telemetry:
    type: uwrt.telemetry
    options:
      # Thresholds as the RViz diagnostic overlay; timeouts as its gyro (2 s), diagnostics and battery (10 s)
      # watchdogs. Battery: state of charge (warn/error below the percentage), one reading per side.
      readings:
        - {id: fog, label: FOG, source: gyro_status, topic: gyro/status, warn_c: 55, error_c: 75, timeout: 2}
        - {id: cpu, label: CPU, source: diagnostic, topic: /diagnostics_agg,
           status: "/Robot Diagnostics/Computers/Core Temperature", warn_c: 70, error_c: 85, timeout: 10}
        - {id: port, label: PORT, source: battery, topic: state/battery, side: port, warn_pct: 50, error_pct: 20, timeout: 10}
        - {id: stbd, label: STBD, source: battery, topic: state/battery, side: stbd, warn_pct: 50, error_pct: 20, timeout: 10}
  recording:
    type: uwrt.recording
    options:
      cameras:
        - {id: ffc, label: FFC, start_service: ffc/zed_node/start_svo_rec, stop_service: ffc/zed_node/stop_svo_rec}
        - {id: dfc, label: DFC, start_service: dfc/zed_node/start_svo_rec, stop_service: dfc/zed_node/stop_svo_rec}
      capture_service: capture_image
  bags:
    type: ros.bagging
    options:
      # ros2 bag record on the robot over ssh, or on this computer. A robot bag runs on its own there: it keeps
      # recording if the viewer closes or the link drops, and any viewer can stop it. This computer's stops with
      # the viewer (stop_on_exit). Extra recorder arguments per target: record_args: [-s, mcap, ...].
      targets:
        - id: robot
          label: Robot
          host: ros@orin2  # prefills the panel's ssh field; the operator can point it at another machine
          directory: ~/bags
          # As ros_launcher.service, with the launcher's RMW, so the recorder joins the running stack.
          setup: |
            source ~/colcon_deploy/install/setup.bash
            source ~/uwrt_config/source/zenoh_server.bash
            export RMW_IMPLEMENTATION=rmw_zenoh_cpp
        - {id: host, label: This computer, directory: ~/bags}
      # Topic sets for "Selected" (riptide_rviz rosbag_presets.yaml); relative names are under the robot namespace.
      presets:
        Random pinger: [/tf, /tf_static, mapping/torpedo, mapping/table, odometry/filtered,
                        ivc/pinger/selected_freq_amp_stream]
  electrical:
    type: uwrt.electrical
    options:
      # riptide_msgs2/ElectricalCommand values; confirm: power cuts ask before sending.
      command_topic: command/electrical
      commands:
        - {id: cycle_computer, label: Cycle computer, value: 0, confirm: true}
        - {id: cycle_robot, label: Cycle robot, value: 3, confirm: true}
        - {id: kill_robot_power, label: Kill robot power, value: 4, confirm: true}
        - {id: cycle_imu, label: Cycle IMU, value: 10}
        - {id: cycle_acoustics, label: Cycle acoustics, value: 1}
        - {id: kill_acoustics, label: Kill acoustics, value: 2}
        - {id: enable_fans, label: Enable fans, value: 5}
        - {id: disable_fans, label: Disable fans, value: 6}
        - {id: enable_leds, label: Enable LEDs, value: 9}
        - {id: disable_leds, label: Disable LEDs, value: 8}
        - {id: clear_depth, label: Clear depth, value: 7}
      imu: {mag_cal_action: vectornav/mag_cal, config_service: vectornav/config}
      tare_action: gyro/tare
      pinger:
        enable_topic: ivc/pinger/enable
        frequency_topic: ivc/pinger/set_freq_broker_khz
        selected_topic: ivc/pinger/selected_freq_khz
        amplitude_topic: ivc/pinger/selected_freq_amp_stream
        frequencies_khz: [25, 30, 35, 37, 40]
        enabled: true
        heartbeat_s: 1   # re-send the enable state (as RViz) so a rebooted board recovers it; 0 = only on change
      ivc:
        tx_topic: ivc/tx
        rx_topic: ivc/rx
        confirm_topic: ivc/tx_success
        # One byte: header (3 bits) and data (5 bits). The first status_headers headers carry a status.
        headers: [tank_cmd_tank_status, talos_cmd_talos_status, talos_cmd_fish_heading]
        statuses: [talos_state_ready, talos_state_deploy_tank, talos_state_tank_go, tank_state_ready, tank_state_deploying]
        status_headers: 2
  run:
    type: sim.run
    options:
      profile: task
      command_topic: simulator/run_command
      score_topic: simulator/run_score
      task_score_topic: simulator/task_score
      events_topic: simulator/task_events
      lights_topic: simulator/magnet_lights
      joints_topic: simulator/claw_joints
      reset_topic: simulator/reset_tasks
  simulation:
    type: ros.simulation_rate
    options:
      node: physics_simulator
      parameter: real_time_factor
      max_rate: 10
      sync_service: sync_sim_to_estimate
      reset_service: reset_sim_to_start
panels:
  - id: control
    type: motion
    title: Motion
    provider: motion
    dock: left_top
    options:
      dive_z: -0.75
  - id: mapping
    type: mapping
    title: Mapping
    provider: mapping
    open: false
    options: {parent_frame: world, tag_frame: estimated_origin_frame, samples: 10}
  - {id: detections, type: detections, title: Vision, open: false}
  - id: cameras
    type: recording
    title: Recording
    provider: recording
    dock: right_bottom
    open: false
    options: {path: "~/svos/run", home: /home/ros, timestamp: true}
  - id: bags
    type: bagging
    title: Bagging
    provider: bags
    dock: right_bottom
    open: false
    options: {name: talos, timestamp: true}
  - id: electrical
    type: electrical
    title: Electrical
    provider: electrical
    dock: right_bottom
    open: false
  - id: actuators
    type: actuators
    title: Actuators
    provider: actuators
    dock: right_bottom
    open: false
  - id: mission
    type: autonomy
    title: Autonomy
    provider: mission
overlays:
  - id: target
    type: pose_gizmo
    title: Pose gizmo  # the arrows and rings in the pool view that command the robot's pose
    provider: motion
    options:
      size_meters: 0.3
      hit_pixels: 20
# Pool view toolbar, in order. Types: host items (view, focus, follow, labels, tf, detections, mpc_path, thrust,
# scene_settings ("Scene" window), pool_viewer ("Display" window), panels_menu (a Windows popup, as the menu bar's),
# preview_task) and provider-backed tools (run, simulation; these name a provider and open their own windows).
# Detection settings live in the "Vision" panel; add `- {type: detections}` here for a compact toggle.
toolbar:  # groups: camera | overlays | windows | preview task (separator: a divider, each with its own id)
  - {type: view}
  - {type: focus}
  - {type: follow}
  - {id: separator_overlays, type: separator}
  - {type: labels}
  - {type: tf}
  - {type: mpc_path}
  - {type: thrust}
  - {id: separator_windows, type: separator}
  - {type: pool_viewer}
  - {type: scene_settings}
  - {id: simulation, type: simulation, provider: simulation}
  - {id: run, type: run, provider: run, options: {profile: task}}
  - {id: separator_task, type: separator}
  - {type: preview_task}
# Command bar (always visible, whatever the window layout), right-aligned beside the pose-source pill; the motion
# panel's Enable / KILL is pinned at its left. Toolbar item types (provider-backed
# ones draw their compact form): robot temperatures, a REC chip per camera while it records, and a BAG chip per
# machine recording a bag.
header:
  - {id: telemetry, type: telemetry, provider: telemetry}
  - {id: recording, type: recording, provider: recording}
  - {id: bagging, type: bagging, provider: bags}
ownership:
  - motion: motion
    autonomy: mission
