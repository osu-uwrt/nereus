# Host configuration of nereus-viewer for the Talos + UWRT stack.
# Everything the bridge does not describe in the scenario document lives here: window size,
# camera card names, focus presets, landmark map, viewer-only robot visuals, topic names of the
# visual-state streams, and the fallback task `ui` block (used until the task pack carries one).

# Latched std_msgs/String scenario document published by the bridge (transient_local, reliable, depth 1).
scenario_topic: /talos/simulator/scenario

window: {width: 1480, height: 940}

# Sibling documents (relative to this file).
panels_config: talos_uwrt_panels.yaml
status_lights_config: talos_uwrt_status_lights.yaml
thruster_visuals_config: talos_uwrt_thruster_visuals.yaml

initial_focus: Vehicle

# Vehicle pose source and display smoothing (CLI: --pose-source, --display-delay, --estimate-delay).
#   source: auto   simulator truth (map -> <namespace>/simulator base link) while it is fresh, else the
#                  localization estimate (<namespace>/base_link): the same viewer serves a real robot.
#           truth  always the simulator truth; estimate  always the estimate (also hides simulator-only
#                  panels and defaults --use-sim-time to false).
# Poses are sampled at a smooth display time: the newest stamp minus the delay, so 100 Hz truth and a 30 Hz
# EKF interpolate instead of stepping. Frames without data at that time fall back to their latest transform.
pose:
  source: auto
  truth_delay_s: 0.02
  other_delay_s: 0.06
  # Simulator only (ignored on a real robot, where the estimate is the only pose): defaults of the Pool Viewer
  # menu's "Localization estimate" section. robot_ghost: translucent robot at the estimate (TF base_link);
  # gizmo_anchor / follow_anchor: truth | estimate, the robot the control gizmo / Follow camera centre on.
  robot_ghost: false
  gizmo_anchor: estimate
  follow_anchor: truth

# Detector markers (topics.detections). Each observation is placed once and then stays fixed in the world.
#   enabled:   overlay on at start (CLI: --detections / --no-detections).
#   placement: pose_source  follow the pose source above (truth: simulator truth camera pose at the marker
#                           stamp; estimate: TF of the marker frame at the stamp, RViz-like)
#              truth | estimate | both   show that placement, or both (truth solid, estimate cyan outline)
#              truth/both need a simulator; on a real robot they are treated as estimate.
#              (CLI: --detections-placement; also a combo in the toolbar when truth exists.)
detections:
  enabled: true
  placement: pose_source
  # The stack's detector sends DELETEALL before every frame's markers, so with true only the newest
  # frame's detections show (RViz behaviour). false: ignore DELETEALL; observations live out their lifetime.
  honor_delete_all: true

# Course from the mapping estimate, drawn like RViz: the stack's marker list (riptide_rviz MarkerPublisher config:
# one riptide_meshes model per mapping TF frame). config: <package>/<path in its share> or a file path;
# meshes: optional local folder of <mesh>/model.dae (default: the file's mesh_pkg). course: auto (pack layout with
# simulator truth, mapping otherwise) | pack | mapping. ghost: draw the mapping estimate over the simulator course.
# hidden: markers hidden at start, by TF frame (gate_frame), label (gate) or mesh (slalom: every post); toggle
# each one in Pool Viewer > Course > Meshes.
mapping_markers:
  config: riptide_rviz/config/markers.yaml
  course: auto
  ghost: false
  hidden: []

# PointCloud2 layers (Vision panel; off until enabled, subscribed only while on). Topics are relative to the
# robot namespace; the simulator bridge publishes the camera clouds on the ZED driver's topics.
point_clouds:
  - {id: yolo, title: YOLO detections, topic: yolo_orientation/point_cloud, size: 4}
  - {id: ffc, title: Front camera, topic: ffc/zed_node/point_cloud/cloud_registered, size: 2}
  - {id: dfc, title: Down camera, topic: dfc/zed_node/point_cloud/cloud_registered, size: 2}

# Visual-state streams, relative to the bridge namespace. Missing publishers are simply absent.
# (the rotor animation and LED topics come from the two documents above.)
topics:
  claw_joints: simulator/claw_joints
  magnet_lights: simulator/magnet_lights
  task_objects: simulator/task_objects
  projectiles: simulator/projectiles
  detections: yolo_orientation/visualization_marker_array
  mpc_path: controller/mpc/predicted_path
  thruster_forces: thruster_forces   # commanded forces (controller); the Thrust toggle draws them

# Thrust toggle (toolbar): one arrow per thruster along its axis, like RViz's thruster wrench displays.
thrust_arrows:
  enabled: false            # on at start (CLI: --thrust)
  metres_per_newton: 0.05   # arrow length; full thrust (28 N) is 1.4 m

# Camera card names by robot-pack sensor id; sensors without an entry are titled by index and id.
cameras:
  ffc: {title: "01  FORWARD CAMERA", model: "ZED X MINI"}
  dfc: {title: "02  DOWNWARD CAMERA", model: "ZED X MINI"}

# Camera presets of the Focus combo. `default` applies to every other resolvable landmark; keys ending in
# `*` match a name prefix. target: course | vehicle | mechanism | mechanisms | landmark.
focus_presets:
  default: {target: landmark, distance: 3.4, pitch: 0.28, yaw_from: landmark_facing, follow: true, labels: true}
  Course: {target: course, distance_scale: 0.65, z_offset: -0.6, pitch: 0.64, yaw: -2.5, yaw_from: absolute, follow: false}
  Vehicle: {target: vehicle, distance: 1.9, pitch: 0.32, yaw_from: vehicle_heading}
  Claw: {target: mechanism, mechanism: claw, offset: [0, 0, 0.06], distance: 0.65, pitch: 0.1, yaw_from: vehicle_heading, yaw_offset: 0.5, labels: false}
  Payloads: {target: mechanisms, mechanisms: [torpedo_launcher, dropper], distance: 0.48, pitch: -0.18, yaw_from: vehicle_heading, yaw_offset: 0.06, labels: false}
  table: {distance: 3.7}
  "magnet_target*": {distance: 0.32, pitch: 0.6}

# Scene preview (--demo): vehicle pose x, y, z, roll, pitch, yaw (radians); optional preview landmark.
preview:
  pose: [3.0, -2.0, -0.75, 0, 0, -0.14]

# Robot-pack assets that the pack lists but does not place as visuals (launcher body).
extra_visuals:
  - {asset: launcher_mesh, frame: origin}

# Claw jaws: pack visuals (by asset id) that translate along the frame's +Y (left) / -Y (right) with
# simulator/claw_joints = [left_m, right_m].
claw:
  left_assets: [claw_left_mesh, claw_left_pad_mesh]
  right_assets: [claw_right_mesh, claw_right_pad_mesh]

# Payload rounds: projectile mesh (robot-pack asset id; unit length, scaled by the mechanism's projectile
# size) and which simulator/projectiles marker namespaces are rounds still seated in a launcher slot
# (marker id = slot index) -> mechanism id.
payloads:
  mesh_asset: projectile_mesh
  loaded_namespaces: {torpedo_loaded: torpedo_launcher, dropper_loaded: dropper}

# Magnet targets: emissive lights drawn at the marker pose/scale of simulator/magnet_lights.
magnet_lights:
  led_radiance: 60

# The scenario's equipment pack (the calibration board) in the observer view at startup. Toggle: Pool Viewer >
# AprilTag board. Camera cards always show it, like the simulator's cameras.
equipment_visible: true

# Fallback task `ui` block (task pack `ui`, when present, overrides key by key). `focus` and
# `demo_targets` name landmarks (task placements/frames) and presets above; names the scenario cannot
# resolve are hidden. map_landmarks: name, optional minimap label, or hidden_in_minimap.
ui:
  title: RoboSub 2026 scorecard
  run_options:
    - {key: role, label: Intended role, type: choice, default: repair,
       choices: [{value: repair, label: Survey & Repair}, {value: rescue, label: Search & Rescue}]}
    - {key: heading_coin, label: Heading coin flip, type: bool, default: true}
    - {key: role_coin, label: Role coin flip, type: bool, default: true}
  focus: [Course, Vehicle, gate, torpedo, bin, table, Payloads, Claw, octagon]
  demo_targets: [gate, torpedo, bin, table]
  manual_adjustment: true
  score_note: Pinger awards await future acoustic integration. No session countdown or automatic time bonus is applied to individual runs.
  score_fields:
    - {key: basket_count, label: Objects in both baskets}
    - {key: time_bonus_eligible, label: Time-bonus prerequisites met}
  previews:
    gate: {depth: 0.75}
    bin: {depth: 0.55, camera: dfc}
    table: {depth: 0.55, camera: dfc}
  run_inspections:
    - {label: Inspect launcher, target: Payloads}
    - {label: Inspect claw, target: Claw}
    - {label: Inspect lights, target: magnet_target1}
  status_fields:
    - {key: intended_role, label: Assigned role}
    - {key: role, label: Scored role}
  map_landmarks:
    - gate
    - {name: slalom_front, minimap_label: slalom}
    - {name: slalom_back, hidden_in_minimap: true}
    - torpedo
    - bin
    - table
    - octagon
