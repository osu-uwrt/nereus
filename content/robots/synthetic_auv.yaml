# Synthetic illustrative AUV; not calibrated hardware.
schema_version: 1
kind: robot
vehicle:
  mass_kg: 10
  inertia_diagonal: [1, 1, 1]
  added_mass_diagonal: [2, 2, 2, 0.1, 0.1, 0.1]
  linear_damping_diagonal: [4, 4, 4, 1, 1, 1]
  quadratic_damping: [8, 8, 8, 1, 1, 1]
  displaced_volume_m3: 0.01
  buoyancy_center_m: [0, 0, 0.02]
  buoyancy_radii_m: [0.2, 0.2, 0.2]
  collision_radius_m: 0.25
  command_timeout_s: 0.5
  thrusters:
    - id: horizontal_port
      position_m: [0, 0.2, 0]
      direction: [1, 0, 0]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: horizontal_starboard
      position_m: [0, -0.2, 0]
      direction: [1, 0, 0]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: vertical_fore
      position_m: [0.2, 0, 0]
      direction: [0, 0, 1]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: vertical_aft
      position_m: [-0.2, 0, 0]
      direction: [0, 0, 1]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
sensors:
  - id: imu
    frame: imu_link
    period_ns: 10000000
    mount: {position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    profile: ../sensors/imu.yaml
  - id: fog
    frame: fog_link
    period_ns: 20000000
    mount: {position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    model: fog
    parameters: {axes: [[0, 0, 1]]}
  - id: dvl
    frame: dvl_link
    period_ns: 100000000
    latency_ns: 20000000
    mount: {position_m: [0, 0, -0.1], orientation_wxyz: [1, 0, 0, 0]}
    model: dvl
    parameters: {minimum_range_m: 0.1, maximum_range_m: 10}
  - id: pressure
    frame: pressure_link
    period_ns: 50000000
    mount: {position_m: [0, 0, -0.1], orientation_wxyz: [1, 0, 0, 0]}
    model: pressure
    parameters:
      reference_pressure_pa: 101325
      reference_density_kg_m3: 1000
      noise: {white_stddev: 10, walk_stddev: 1}
