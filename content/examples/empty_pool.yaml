# Synthetic four-thruster AUV; illustrative parameters, not a calibrated robot.
schema_version: 1
timestep_ns: 2000000
ticks: 1500
vehicle:
  mass_kg: 10
  inertia_diagonal: [1, 1, 1]
  added_mass_diagonal: [2, 2, 2, 0.1, 0.1, 0.1]
  linear_damping_diagonal: [4, 4, 4, 1, 1, 1]
  quadratic_damping: [8, 8, 8, 1, 1, 1]
  displaced_volume_m3: 0.01
  buoyancy_center_m: [0, 0, 0.02]
  buoyancy_radii_m: [0.2, 0.2, 0.2]
  collision_radius_m: 0.25
  command_timeout_s: 0.5
  thrusters:
    - id: horizontal_port
      position_m: [0, 0.2, 0]
      direction: [1, 0, 0]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: horizontal_starboard
      position_m: [0, -0.2, 0]
      direction: [1, 0, 0]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: vertical_fore
      position_m: [0.2, 0, 0]
      direction: [0, 0, 1]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
    - id: vertical_aft
      position_m: [-0.2, 0, 0]
      direction: [0, 0, 1]
      delay_s: 0.1
      rise_time_s: 0.08
      fall_time_s: 0.06
      slew_rate_n_s: 300
      forward_limit_n: 28
      reverse_limit_n: 28
pool:
  length_m: 20
  width_m: 10
  depth_m: 5
  water_level_m: 0
  water_density_kg_m3: 1000
  current_m_s: [0, 0, 0]
initial:
  position_m: [2, 5, -2]
  orientation_wxyz: [1, 0, 0, 0]
  linear_velocity_m_s: [0, 0, 0]
  angular_velocity_rad_s: [0, 0, 0]
commands:
  - {tick: 0, forces_n: [10, 10, 0, 0]}
  - {tick: 200, forces_n: [10, 10, 0, 0]}
  - {tick: 400, forces_n: [10, 10, 0, 0]}
  - {tick: 600, forces_n: [10, 10, 0, 0]}
  - {tick: 800, forces_n: [10, 10, 0, 0]}
  - {tick: 1000, forces_n: [0, 0, 0, 0]}
