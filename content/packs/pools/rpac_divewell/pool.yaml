# Ohio State RPAC dive well (Ron O'Brien Diving Well, McCorkle Aquatic Pavilion).
# Pool frame: origin at a floor-plan corner on the water surface, +X along the lap lines, +Y across them,
# +Z up. x = 0 is the deep (17 ft) end, x = length the shallow (14 ft) end. The scenario places the pool
# in the world. Current vectors are in world axes.
# Width is 56 ft (eight 7 ft lanes); depth 14-17 ft per the published facility specs.
kind: pool
id: rpac_divewell
description: Ohio State RPAC dive well, 25 m x 56 ft, 17 ft deep rising to 14 ft.

type: rectangular_pool
parameters:
  length_m: 25.0
  width_m: 17.0688             # 56 ft
  depth_m: 5.1816              # 17 ft
  deck_height_m: 0.3048        # above water
  water_level_m: 0.0
  water_density_kg_m3: 998.2
  surface_pressure_pa: 101325
  current_m_s: [0.0, 0.0, 0.0]
  current_oscillation_amplitude_m_s: [0.0, 0.0, 0.0]
  current_oscillation_frequency_hz: 0.0
  # 17 ft at the deep end curving up to 14 ft. The curve's middle (12.3 m) matches the published volume
  # (536,792 gal over 4,638 sq ft: 15.47 ft mean depth).
  floor_profile:
    along: x
    points_m: [[0, 5.1816], [9.3, 5.1816], [15.3, 4.2672], [25.0, 4.2672]]

# Static wall boxes in pool coordinates, depth + deck + 1 m tall; the floor's boxes come from the profile.
collision_boxes:
- {id: west_wall, size_m: [1, 19.0688, 6.4864], center_m: [-0.5, 8.5344, -2.4384], orientation_wxyz: [1, 0, 0, 0]}
- {id: east_wall, size_m: [1, 19.0688, 6.4864], center_m: [25.5, 8.5344, -2.4384], orientation_wxyz: [1, 0, 0, 0]}
- {id: south_wall, size_m: [25.0, 1, 6.4864], center_m: [12.5, -0.5, -2.4384], orientation_wxyz: [1, 0, 0, 0]}
- {id: north_wall, size_m: [25.0, 1, 6.4864], center_m: [12.5, 17.5688, -2.4384], orientation_wxyz: [1, 0, 0, 0]}

# White lines on a dark blue bottom.
markings:
  color_rgb: [0.85, 0.93, 0.95]
  width_m: 0.254
  # Eight lap lines centred in 7 ft lanes (first 3.5 ft from the y = 0 wall), T ends at both ends.
  lane_grid:
    along_x: {count: 8, spacing_m: 2.1336}
    inset_m: 2.0
    ends: t
    t_length_m: 1.0
  lines:
  # Cross lines, 14 ft + 12.5 ft apart from the deep wall, 20 ft long, staggered across the lanes.
  - {from: [4.2672, 1.9], to: [4.2672, 7.996]}
  - {from: [8.0772, 2.6], to: [8.0772, 8.696]}
  - {from: [11.8872, 3.1], to: [11.8872, 9.196]}
  - {from: [15.6972, 1.7], to: [15.6972, 7.796]}
  # Diving lines beside lap lines 4 and 6 at the shallow end.
  - {from: [18.5, 8.0], to: [23.0, 8.0]}
  - {from: [18.5, 11.0], to: [23.0, 11.0]}
  # One plus-shaped target on the shallow-end wall above each lap line: a stem and a crossbar.
  wall_lines:
  - {wall: x_max, from: [1.0668, -1.4], to: [1.0668, -0.25]}
  - {wall: x_max, from: [0.8168, -0.5], to: [1.3168, -0.5]}
  - {wall: x_max, from: [3.2004, -1.4], to: [3.2004, -0.25]}
  - {wall: x_max, from: [2.9504, -0.5], to: [3.4504, -0.5]}
  - {wall: x_max, from: [5.334, -1.4], to: [5.334, -0.25]}
  - {wall: x_max, from: [5.084, -0.5], to: [5.584, -0.5]}
  - {wall: x_max, from: [7.4676, -1.4], to: [7.4676, -0.25]}
  - {wall: x_max, from: [7.2176, -0.5], to: [7.7176, -0.5]}
  - {wall: x_max, from: [9.6012, -1.4], to: [9.6012, -0.25]}
  - {wall: x_max, from: [9.3512, -0.5], to: [9.8512, -0.5]}
  - {wall: x_max, from: [11.7348, -1.4], to: [11.7348, -0.25]}
  - {wall: x_max, from: [11.4848, -0.5], to: [11.9848, -0.5]}
  - {wall: x_max, from: [13.8684, -1.4], to: [13.8684, -0.25]}
  - {wall: x_max, from: [13.6184, -0.5], to: [14.1184, -0.5]}
  - {wall: x_max, from: [16.002, -1.4], to: [16.002, -0.25]}
  - {wall: x_max, from: [15.752, -0.5], to: [16.252, -0.5]}

surface:
  tile_rgb: [0.2, 0.42, 0.58]
  tile_size_m: 0.0508

# Water colour and attenuation seen by the simulated cameras.
water_optics:
  tint_rgb: [0.025, 0.22, 0.29]
  distance_scale: 1.88
  distance_power: 0.40
  clear_distance_m: 0.0
  scattering: 0.458
  absorption_per_m_rgb: [0.648, 0.145, 0.025]

# Indoor natatorium: fixed overhead light, sun angles unused.
lighting:
  profile: indoor
  direct_light: 1.0
  ambient_light: 0.8
  sun_azimuth_deg: 225.0
  sun_elevation_deg: 55.0
  glare: 0.5
