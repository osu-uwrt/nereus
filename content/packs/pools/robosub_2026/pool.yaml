  - {path: riptide_simulator/camera_faker/include/pool_viewer/renderer.hpp, sha256: 6029b5e2e2c6f7c4702cc3ba067d09169b37c45725d22948f66ff169c5cfed3b, hash_basis: git_revision}   # water tint
  - {path: riptide_simulator/camera_faker/src/pool_viewer/main.cpp, sha256: 853c88210565b3f79917e649ff1938ce7ca0f5686a95e3a4e60d36ba5f96fe8a, hash_basis: git_revision}   # lighting parameters
  - {path: riptide_simulator/camera_faker/launch/pool_viewer.launch.py, sha256: d0182e697a8bc82584726dad7a05fcf1dd4bfa2357012e46d3feb2857876563a, hash_basis: git_revision}   # lighting profile
  - {path: riptide_simulator/camera_faker/launch/zedfaker.launch.py, sha256: ee1289eb98b8aaad50e50bd60e50d5213d31cf6d654c9e19e1020dacc4488621, hash_basis: git_revision}   # no lighting override
  derived_from:
  - {path: content/worlds/competition_pool.yaml, sha256: 4d1c73dd17b2c474ad825104da2f3d0dcfdb72dc1c8153ac1ad777a12178cd48}

# Floor/wall/deck/lane appearance is generated geometry in the original renderer; no files.
assets: []

type: rectangular_pool
parameters:
  length_m: 50.0
  width_m: 22.86
  depth_m: 2.1336
  deck_height_m: 0.305288888      # above water; wall box height = depth + deck + 1 = 3.438888888
  water_level_m: 0.0
  water_density_kg_m3: 998.2
  surface_pressure_pa: 101325     # platform default, not an original pressure-sensor model
  current_m_s: [0.0, 0.0, 0.0]
  current_oscillation_amplitude_m_s: [0.0, 0.0, 0.0]
  current_oscillation_frequency_hz: 0.1
  speed_of_sound_m_s: 1500        # environment value; original source is the robot file talos.yaml

# Static contact boxes in pool-local coordinates (same as native competition_pool.yaml).
collision_boxes:
- {id: floor, size_m: [50.0, 22.86, 1], center_m: [25.0, 11.43, -2.6336], orientation_wxyz: [1, 0, 0, 0]}
- {id: west_wall, size_m: [1, 24.86, 3.438888888], center_m: [-0.5, 11.43, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: east_wall, size_m: [1, 24.86, 3.438888888], center_m: [50.5, 11.43, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: south_wall, size_m: [50.0, 1, 3.438888888], center_m: [25.0, -0.5, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: north_wall, size_m: [50.0, 1, 3.438888888], center_m: [25.0, 23.36, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}

# Sensor-affecting water appearance for offscreen cameras (step-3 exception). Not viewer UI.
# cameras.yaml water.* values; tint is the Look default (renderer.hpp:70), not overridden by cameras.yaml.
water_optics:
  required_from_step: 3
  tint_rgb: [0.025, 0.22, 0.29]
  distance_scale: 1.88
  distance_power: 0.40
  clear_distance_m: 0.0
  scattering: 0.458
  absorption_per_m_rgb: [0.648, 0.145, 0.025]

# Sensor-affecting lighting for offscreen cameras; sensor images share this startup look (main.cpp:721).
# profile: pool_viewer.launch.py:61 defaults lighting to outdoor and passes it as lighting.profile (:175);
# zedfaker.launch.py does not override it, so the node default indoor (main.cpp:394) is not what ran.
# Other values: main.cpp:398-402 parameter defaults, not overridden by cameras.yaml or the launch files.
lighting:
  required_from_step: 3
  profile: outdoor
  direct_light: 1.0
  ambient_light: 0.8
  sun_azimuth_deg: 225.0
  sun_elevation_deg: 55.0
  glare: 0.5
