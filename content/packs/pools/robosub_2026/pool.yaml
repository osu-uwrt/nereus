# RoboSub 2026 competition pool.
# Pool frame: origin at a floor-plan corner on the water surface, +X along the length,
# +Y along the width, +Z up. The scenario places the pool in the world.
# Current vectors are in world axes.
kind: pool
id: robosub_2026
description: RoboSub 2026 competition pool.

type: rectangular_pool
parameters:
  length_m: 50.0
  width_m: 22.86
  depth_m: 2.1336
  deck_height_m: 0.305288888   # above water
  water_level_m: 0.0
  water_density_kg_m3: 998.2
  surface_pressure_pa: 101325
  current_m_s: [0.0, 0.0, 0.0]
  current_oscillation_amplitude_m_s: [0.0, 0.0, 0.0]
  current_oscillation_frequency_hz: 0.1

# Static contact boxes in pool coordinates.
collision_boxes:
- {id: floor, size_m: [50.0, 22.86, 1], center_m: [25.0, 11.43, -2.6336], orientation_wxyz: [1, 0, 0, 0]}
- {id: west_wall, size_m: [1, 24.86, 3.438888888], center_m: [-0.5, 11.43, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: east_wall, size_m: [1, 24.86, 3.438888888], center_m: [50.5, 11.43, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: south_wall, size_m: [50.0, 1, 3.438888888], center_m: [25.0, -0.5, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}
- {id: north_wall, size_m: [50.0, 1, 3.438888888], center_m: [25.0, 23.36, -0.9141555559999999], orientation_wxyz: [1, 0, 0, 0]}

# Lane lines on the floor and up the end walls (viewer, cameras and course map). 9 ft apart, 10 in wide,
# stopping 2 m short of the walls with 1 m T ends. The color is the dark line tile seen through the finish.
markings:
  color_rgb: [0.093, 0.14, 0.16]
  width_m: 0.254
  lane_grid:
    along_x: {count: 8, spacing_m: 2.7432}
    along_y: {count: 17, spacing_m: 2.7432}
    inset_m: 2.0
    ends: t
    t_length_m: 1.0
    on_walls: true

# Water color and attenuation seen by the simulated cameras.
water_optics:
  tint_rgb: [0.025, 0.22, 0.29]
  distance_scale: 1.88
  distance_power: 0.40
  clear_distance_m: 0.0
  scattering: 0.458
  absorption_per_m_rgb: [0.648, 0.145, 0.025]

# Lighting seen by the simulated cameras.
lighting:
  profile: outdoor
  direct_light: 1.0
  ambient_light: 0.8
  sun_azimuth_deg: 225.0
  sun_elevation_deg: 55.0
  glare: 0.5
