# Pool pack for native navigation and offscreen-camera water/lighting appearance.
# Pool-local frame: origin at the floor-plan corner on the water surface, +X along length,
# +Y along width, +Z up; water surface z = water_level_m. No robot, task or course layout here:
# the scenario places this pool in its world frame (original map_origin_pool).
# Current vectors keep world axes after placement (native world_placement semantics).
# Working copy for the step-2 navigation bridge; the approved full contract is proposals/step1/packs.
schema_version: 1
kind: pool
id: robosub_2026
description: Finite competition pool used by the original 2026 course (original id competition_pool).
provenance:
  revisions:
    riptide_simulator: 07647eebe706f96ea7b76db3cc9802735a146698
    riptide_core: 7f37bdd62ab90113844137a23806c89b23a8ab9b
  worktree_checked: '2026-09-29'
  sources:
