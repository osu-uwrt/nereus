  - {path: riptide_simulator/c_simulator/src/physics_simulator.cpp, sha256: d4b05d378425bfdb59773ba6b20f0db44f14469c2be4eb0ccdfb69824ff05e14, hash_basis: git_revision}   # pool boxes
  - {path: riptide_core/riptide_descriptions/config/talos.yaml, sha256: 7f0c5a703e3974401a23ce316dbedde1327e974b16105d39a97c7a64837bd664, hash_basis: git_revision}   # speed_of_sound
