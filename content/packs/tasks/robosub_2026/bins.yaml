# Bins: four crates for the droppers and two magnet lights.
# Task frame: the crate assembly, +Z up. Crates catch any payload, but only dropper landings
# score. Magnet lights latch when the robot's magnet tip comes close.
kind: task
id: bins
description: Four vinyl-marked crates for dropper payloads and two magnet light targets.

frames:
- {id: bin_vinyl1, position_m: [0.474, -0.122, 0.301], orientation_wxyz: [1, 0, 0, 0]}
- {id: bin_vinyl2, position_m: [0.237, 0.347, 0.335], orientation_wxyz: [1, 0, 0, 0]}
- {id: bin_vinyl3, position_m: [-0.21663, -0.3466, 0.47036], orientation_wxyz: [1, 0, 0, 0]}
- {id: bin_vinyl4, position_m: [-0.43325, 0.12206, 0.57196], orientation_wxyz: [1, 0, 0, 0]}
- {id: magnet_target1, position_m: [0.76512, 0.37018, 0.25975], orientation_wxyz: [1, 0, 0, 0]}
- {id: magnet_target2, position_m: [-0.70442, -0.37018, 0.65], orientation_wxyz: [0, 0, 0, 1]}   # yaw 180

props:
- id: bin_assembly
  type: static_body
  parameters:
    collision_boxes: []   # no robot contact boxes; payloads hit the crate regions
    # Each vinyl picks its texture (blood/fire) from its crate's class. The crate lattice and liner are
    # generated from the crate dimensions (tools/generate_course_geometry.py). Each magnet target shows the
    # light housing tilted to its face, with a clear cover and 16 LEDs lit by the target's indicator.
    visuals:
    - {asset: bin_mesh, frame: task, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    - {asset: bin_vinyl_mesh, frame: bin_vinyl1, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], texture: bin_vinyl_blood_texture}
    - {asset: bin_vinyl_mesh, frame: bin_vinyl2, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], texture: bin_vinyl_fire_texture}
    - {asset: bin_vinyl_mesh, frame: bin_vinyl3, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], texture: bin_vinyl_fire_texture}
    - {asset: bin_vinyl_mesh, frame: bin_vinyl4, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], texture: bin_vinyl_blood_texture}
    - {asset: crate_lattice_mesh, frame: bin_vinyl1, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    - {asset: crate_liner_mesh, frame: bin_vinyl1, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], material: liner}
    - {asset: crate_lattice_mesh, frame: bin_vinyl2, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    - {asset: crate_liner_mesh, frame: bin_vinyl2, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], material: liner}
    - {asset: crate_lattice_mesh, frame: bin_vinyl3, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    - {asset: crate_liner_mesh, frame: bin_vinyl3, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], material: liner}
    - {asset: crate_lattice_mesh, frame: bin_vinyl4, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    - {asset: crate_liner_mesh, frame: bin_vinyl4, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0], material: liner}
    - {asset: magnet_housing_mesh, frame: magnet_target1, position_m: [0, 0, 0], orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]}
    - {asset: magnet_cover_mesh, frame: magnet_target1, position_m: [0, 0, 0], orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0], material: clear}
    - asset: magnet_leds_mesh
      frame: magnet_target1
      position_m: [0, 0, 0]
      orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]
      material: emissive
      radiance: 200.0
      indicator: {region: magnet_target1, color_rgb: {red: [1.0, 0.001, 0.002], green: [0.002, 1.0, 0.004]}}
    - {asset: magnet_housing_mesh, frame: magnet_target2, position_m: [0, 0, 0], orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]}
    - {asset: magnet_cover_mesh, frame: magnet_target2, position_m: [0, 0, 0], orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0], material: clear}
    - asset: magnet_leds_mesh
      frame: magnet_target2
      position_m: [0, 0, 0]
      orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]
      material: emissive
      radiance: 200.0
      indicator: {region: magnet_target2, color_rgb: {red: [1.0, 0.001, 0.002], green: [0.002, 1.0, 0.004]}}

regions:
- id: bin_vinyl1
  type: open_crate
  parameters:
    frame: bin_vinyl1
    class: blood
    # CleverMade 25 L crate; local z = 0 is the interior (vinyl) floor.
    outer_width_m: 0.333248
    inner_width_m: 0.3048
    outer_height_m: 0.2794
    base_thickness_m: 0.008128
    liner_thickness_m: 0.004
    liner_height_fraction: 0.5
- id: bin_vinyl2
  type: open_crate
  parameters:
    frame: bin_vinyl2
    class: fire
    # CleverMade 25 L crate; local z = 0 is the interior (vinyl) floor.
    outer_width_m: 0.333248
    inner_width_m: 0.3048
    outer_height_m: 0.2794
    base_thickness_m: 0.008128
    liner_thickness_m: 0.004
    liner_height_fraction: 0.5
- id: bin_vinyl3
  type: open_crate
  parameters:
    frame: bin_vinyl3
    class: fire
    # CleverMade 25 L crate; local z = 0 is the interior (vinyl) floor.
    outer_width_m: 0.333248
    inner_width_m: 0.3048
    outer_height_m: 0.2794
    base_thickness_m: 0.008128
    liner_thickness_m: 0.004
    liner_height_fraction: 0.5
- id: bin_vinyl4
  type: open_crate
  parameters:
    frame: bin_vinyl4
    class: blood
    # CleverMade 25 L crate; local z = 0 is the interior (vinyl) floor.
    outer_width_m: 0.333248
    inner_width_m: 0.3048
    outer_height_m: 0.2794
    base_thickness_m: 0.008128
    liner_thickness_m: 0.004
    liner_height_fraction: 0.5
- id: magnet_target1
  type: proximity_target
  parameters:
    frame: magnet_target1
    # The face tilts up 45 deg; the sensor sits 8 mm behind it.
    face_orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]
    sensor_offset_m: [-0.008, 0.0, 0.0]
    trigger_distance_m: 0.1524
    dwell_s: 0.5
    probe_mechanism_type: magnet   # the robot's magnet tip; passive, no arming
    indicator: {initial: red, latched: green}
- id: magnet_target2
  type: proximity_target
  parameters:
    frame: magnet_target2
    # The face tilts up 45 deg; the sensor sits 8 mm behind it.
    face_orientation_wxyz: [0.9238795325112867, 0.0, -0.3826834323650898, 0.0]
    sensor_offset_m: [-0.008, 0.0, 0.0]
    trigger_distance_m: 0.1524
    dwell_s: 0.5
    probe_mechanism_type: magnet   # the robot's magnet tip; passive, no arming
    indicator: {initial: red, latched: green}
events:
- id: bin_vinyl1_inside
  type: payload_landing
  parameters: {region: bin_vinyl1, projectile_mechanism_types: [launcher, dropper], outcome: inside}
- id: bin_vinyl1_blocked
  type: payload_landing
  parameters: {region: bin_vinyl1, projectile_mechanism_types: [launcher, dropper], outcome: blocked}
- id: bin_vinyl2_inside
  type: payload_landing
  parameters: {region: bin_vinyl2, projectile_mechanism_types: [launcher, dropper], outcome: inside}
- id: bin_vinyl2_blocked
  type: payload_landing
  parameters: {region: bin_vinyl2, projectile_mechanism_types: [launcher, dropper], outcome: blocked}
- id: bin_vinyl3_inside
  type: payload_landing
  parameters: {region: bin_vinyl3, projectile_mechanism_types: [launcher, dropper], outcome: inside}
- id: bin_vinyl3_blocked
  type: payload_landing
  parameters: {region: bin_vinyl3, projectile_mechanism_types: [launcher, dropper], outcome: blocked}
- id: bin_vinyl4_inside
  type: payload_landing
  parameters: {region: bin_vinyl4, projectile_mechanism_types: [launcher, dropper], outcome: inside}
- id: bin_vinyl4_blocked
  type: payload_landing
  parameters: {region: bin_vinyl4, projectile_mechanism_types: [launcher, dropper], outcome: blocked}
- id: magnet_target1_on
  type: activate
  parameters: {region: magnet_target1}
- id: magnet_target2_on
  type: activate
  parameters: {region: magnet_target2}

# Drops, classes, unique crates and lights depend on the role: scored by the rules.
scoring: []
