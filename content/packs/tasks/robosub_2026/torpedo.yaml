# Torpedo board.
# Task frame: board centre, +X out of the printed face toward the approach side, +Z up.
kind: task
id: torpedo
description: Perforated torpedo board with two fire and two blood openings.

frames: []   # hole centres are panel data (holes below)

props:
- id: board
  type: static_body
  parameters:
    # Robot contact box only; projectiles never collide with it.
    collision_boxes:
    - {id: board_proxy, size_m: [0.05, 1.2, 1.2], center_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    visuals:
    - {asset: torpedo_mesh, frame: task, position_m: [0, 0, 0], orientation_wxyz: [1, 0, 0, 0]}
    # The same four circular cutouts are cut through the board in the camera images.
    cutouts: {region: panel, faces_local_x_m: [0.0, -0.004]}

regions:
- id: panel
  type: perforated_panel
  parameters:
    plane: {axis: x, offset_m: 0.0}      # crossing detected in either direction
    half_size_m: 0.3048                   # |y|,|z| <= half_size; outside => no event
    # Centre (y, z) = (uv - 0.5) * 2 * half_size; radius = radius_uv * 2 * half_size.
    # u -> +Y (right when viewed from +X), v -> +Z. Inner ring edges of Task4_ver1_Fixed.png.
    holes:
    # class and size are read by the scoring hook
    - {id: fire_large, class: fire, size: large, uv: [0.16142625, 0.58890478], radius_uv: 0.10469}
    - {id: fire_small, class: fire, size: small, uv: [0.51378955, 0.81221886], radius_uv: 0.08365}
    - {id: blood_large, class: blood, size: large, uv: [0.85499477, 0.14589262], radius_uv: 0.10469}
    - {id: blood_small, class: blood, size: small, uv: [0.50045453, 0.18734768], radius_uv: 0.08365}
    # Pass iff |hit - centre| + r / max(0.1, |axis . local X|) <= radius; otherwise blocked.
    projectile_clearance: {rule: radius_over_axis_cosine, min_cosine: 0.1}

events:
- id: hole_pass
  type: hit
  parameters: {region: panel, projectile_mechanism_type: launcher, outcome: pass, stop_projectile: false,
               emits: [hole_id, hole_class, hole_size, projectile_id, hit_point_local]}
- id: panel_blocked
  type: hit
  parameters: {region: panel, projectile_mechanism_type: launcher, outcome: blocked, stop_projectile: true,
               emits: [projectile_id, hit_point_local]}
- id: board_contact   # informational
  type: contact
  parameters: {prop: board, with: robot}

# Per-shot, distance, sequence and role/class points: scored by the hook, which takes the release
# distance from the launcher's fired event (|local X of the projectile tip|).
scoring: []
