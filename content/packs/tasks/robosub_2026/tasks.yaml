# RoboSub 2026 tasks: task files, assets, run options and scoring rules.
# The scenario places the tasks; robot requirements are by mechanism type, never robot id.
kind: tasks
id: robosub_2026
description: RoboSub 2026 course tasks and scoring (Survey & Repair / Search & Rescue roles).
# Task meshes and textures. DAE textures resolve next to each model.dae.
assets:
- {id: gate_mesh, path: assets/gate/model.dae}
- {id: gate_repair_mesh, path: assets/gate_repair/model.dae}
- {id: gate_repair_texture, path: assets/gate_repair/Task1_SurveyRepair_Fixed.png}
- {id: gate_rescue_mesh, path: assets/gate_rescue/model.dae}
- {id: gate_rescue_texture, path: assets/gate_rescue/Task1_SearchRescue_Fixed.png}
- {id: torpedo_mesh, path: assets/torpedo/model.dae}
- {id: torpedo_texture, path: assets/torpedo/Task4_ver1_Fixed.png}
# Table collision meshes (prop physics).
- {id: table_mesh, path: assets/table/table.obj}
- {id: basket_helmet_mesh, path: assets/table/table_basket_helmet.obj}
- {id: basket_warning_mesh, path: assets/table/table_basket_warning.obj}
- {id: pill_mesh, path: assets/table/table_pill.obj}
- {id: bandage_mesh, path: assets/table/table_bandage.obj}
- {id: nut_and_bolt_mesh, path: assets/table/table_nut_and_bolt.obj}
- {id: plug_mesh, path: assets/table/table_plug.obj}

- {id: slalom_mesh, path: assets/slalom/model.dae}
- {id: bin_mesh, path: assets/bin/model.dae}
- {id: bin_magnet_mesh, path: assets/bin_magnet/model.dae}
- {id: bin_vinyl_mesh, path: assets/bin_vinyl/model.dae}
- {id: bin_vinyl_blood_texture, path: assets/bin_vinyl/Task3_Blood_Fixed.png}
- {id: bin_vinyl_fire_texture, path: assets/bin_vinyl/Task3_Fire_Fixed.png}
- {id: octagon_buoy_mesh, path: assets/octagon_buoy/model.dae}
- {id: octagon_buoy_texture, path: assets/octagon_buoy/Task5_Search_Fixed.png}
- {id: octagon_compass_mesh, path: assets/octagon_compass/model.dae}
- {id: octagon_compass_texture, path: assets/octagon_compass/Task5_Survey_Fixed.png}
- {id: octagon_hammer_and_wrench_mesh, path: assets/octagon_hammer_and_wrench/model.dae}
- {id: octagon_hammer_and_wrench_texture, path: assets/octagon_hammer_and_wrench/Task5_Repair_Fixed.png}
- {id: octagon_sos_mesh, path: assets/octagon_sos/model.dae}
- {id: octagon_sos_texture, path: assets/octagon_sos/Task5_Rescue_Fixed.png}

# Table display meshes; origins match the .obj collision meshes of the same name.
- {id: table_visual, path: assets/visual/table/model.dae}
- {id: basket_helmet_visual_task5_redcross_fixed, path: assets/visual/table_basket_helmet/Task5_RedCross_Fixed.png}
- {id: basket_helmet_visual, path: assets/visual/table_basket_helmet/model.dae}
- {id: basket_warning_visual_task5_warning_fixed, path: assets/visual/table_basket_warning/Task5_Warning_Fixed.png}
- {id: basket_warning_visual, path: assets/visual/table_basket_warning/model.dae}
- {id: pill_visual_task5_pill_fixed, path: assets/visual/table_pill/Task5_Pill_Fixed.png}
# pill and nut_and_bolt: body faces use the dark-plastic Material.006 (the upstream export put them on
# the vinyl material, which rendered transparent).
- {id: pill_visual, path: assets/visual/table_pill/model.dae}
- {id: bandage_visual_task5_bandaid_fixed, path: assets/visual/table_bandage/Task5_BandAid_Fixed.png}
- {id: bandage_visual, path: assets/visual/table_bandage/model.dae}
- {id: nut_and_bolt_visual_task5_nutbolt_fixed, path: assets/visual/table_nut_and_bolt/Task5_NutBolt_Fixed.png}
- {id: nut_and_bolt_visual, path: assets/visual/table_nut_and_bolt/model.dae}
- {id: plug_visual_task5_electric_fixed, path: assets/visual/table_plug/Task5_Electric_Fixed.png}
- {id: plug_visual, path: assets/visual/table_plug/model.dae}

# Generated course geometry (tools/generate_course_geometry.py) and the magnet-light housing parts.
- {id: crate_lattice_mesh, path: assets/course/crate_lattice.glb}
- {id: crate_liner_mesh, path: assets/course/crate_liner.glb}
- {id: octagon_ring_mesh, path: assets/course/octagon_ring.glb}
- {id: magnet_housing_mesh, path: assets/course/magnet_lights/housing.glb}
- {id: magnet_cover_mesh, path: assets/course/magnet_lights/cover.glb}
- {id: magnet_leds_mesh, path: assets/course/magnet_lights/leds.glb}

tasks: [gate.yaml, torpedo.yaml, table.yaml, slalom.yaml, bins.yaml, surface.yaml]   # task files (kind task)

# Mechanisms a robot needs for each task; checked when a scenario is resolved.
requires:
- {task: torpedo, mechanism_type: launcher, min_count: 1}
- {task: bins, mechanism_type: dropper, min_count: 1}
- {task: bins, mechanism_type: magnet, min_count: 1}
- {task: table, mechanism_type: claw, min_count: 1}

# Run options and their defaults.
run_options:
- {key: role, type: choice, choices: [repair, rescue], default: repair}
- {key: heading_coin, type: bool, default: true}
- {key: role_coin, type: bool, default: true}
- {key: pinger_task, type: choice, choices: [none, deploy, restore], default: none}
- {key: pinger_random, type: bool, default: false}
# Each bin crate's vinyl (its class and texture), fixed for the session: set by the scenario.
- {key: bin_vinyl1_class, type: choice, choices: [blood, fire], default: blood, fixed: true}
- {key: bin_vinyl2_class, type: choice, choices: [blood, fire], default: fire, fixed: true}
- {key: bin_vinyl3_class, type: choice, choices: [blood, fire], default: fire, fixed: true}
- {key: bin_vinyl4_class, type: choice, choices: [blood, fire], default: blood, fixed: true}

# Scoring: compiled rules (extensions/rules/robosub_2026) and their parameters. The rules turn
# (run state, events since the last call) into score row changes, run-status fields and the event feed.
scoring_rules:
- name: robosub_2026
  parameters:
    roles:
      repair: {target_class: fire, facing_icons: [compass, hammer_and_wrench]}
      rescue: {target_class: blood, facing_icons: [buoy, sos]}
    award_policy: max_per_row   # a row's score only increases
    eligibility: gate_passed_and_not_ended   # every row but the gate needs the gate passed first
    gate:
      role_reference_frame: gate_repair   # repair iff the crossing is on this frame's side
      style: {quarter_rad: 1.5707963267948966, epsilon_rad: 1.0e-6, max_quarters: 8, roll_pitch_first: true}
    torpedo:
      good_results: [success, wrong_target]   # both count for per-shot points
      sequence_order: [large, small]   # launch order, both at the correct class
      release_distance: {task: torpedo, measure: abs_local_x_of_projectile_tip}
    points:   # RoboSub 2026 points
      pinger_first: 500
      pinger_second: 1500
      gate: 100
      heading: 300
      role: 150
      slalom_same: 400
      slalom_other: 200
      slalom_depth: 200
      bin: 300
      bin_class: 500
      torpedo: 600
      distance_far: 400
      distance_near: 200
      distance_far_m: 0.4572
      distance_near_m: 0.3048
      sequence: 1400
      light: 500
      max_lights: 2
      max_shots: 2
      object_drop: 200
      basket_correct: 700
      basket_other: 500
      surface: 800
      object_surface: 400
      facing_correct: 400
      facing_other: 200
      facing_count: 700
      basket_count: 1000
      basket_count_near: 500
      home: 300
      style_rp: 200
      style_yaw: 100
      max_style_quarters: 8
    feed:   # event kinds of the simulator/task_events feed
      kinds: {launcher: torpedo, dropper: dropper, claw: claw}
      magnet_kind: magnet
      basket_names: {helmet_basket: helmet, warning_basket: warning}
    slalom: {rows: [slalom_front, slalom_middle, slalom_back]}   # region ids double as score rows
    bins: {mechanism_type: dropper}   # only dropper landings inside a crate score
    table: {baskets: [helmet_basket, warning_basket]}   # box region ids
    # Breach margin and surface/facing/turn dwells belong to the surface regions in surface.yaml;
    # the rules only see their events.

# Scorecard rows, in order.
score_rows:
- {key: gate, label: Gate passage / heading / role / style}
- {key: slalom_front, label: Slalom row 1}
- {key: slalom_middle, label: Slalom row 2}
- {key: slalom_back, label: Slalom row 3}
- {key: bins, label: Bin markers}
- {key: lights, label: Magnet lights}
- {key: torpedoes, label: Torpedo openings}
- {key: sequence, label: Torpedo sequence bonus}
- {key: distance, label: Torpedo distance bonuses}
- {key: surface, label: Surface inside octagon}
- {key: facing, label: Surface facing image}
- {key: objects_surface, label: Surface with objects}
- {key: objects_drop, label: Release objects}
- {key: baskets, label: Place objects in baskets}
- {key: basket_count, label: Signal basket count with turns}
- {key: home, label: Return through gate}
- {key: pinger_first, label: "Random pinger: first task"}
- {key: pinger_second, label: "Random pinger: second task"}

# Payload/claw outcome counters published on simulator/task_score.
outcome_counters: [success, wrong_target, blocked, miss]

run_messages:
  start: "Run started; pass the gate first"
  stop: Run stopped
  adjustment: Manual adjustment updated
  reset: Tasks and run reset

# Operator scorecard in the viewer.
ui:
  title: RoboSub 2026 scorecard
  run_options:
  - key: role
    label: Coin-flip role
    type: choice
    default: repair
    choices:
    - {value: repair, label: Survey & Repair}
    - {value: rescue, label: Search & Rescue}
  - {key: heading_coin, label: Heading coin flip, type: bool, default: true}
  - {key: role_coin, label: Role coin flip, type: bool, default: true}
  focus: [Course, Vehicle, gate, torpedo, slalom, bins, table, Payloads, Claw]
  demo_targets: [gate, torpedo, bins, table]
  manual_adjustment: true
  score_note: Pinger awards await future acoustic integration. No session countdown or automatic time bonus is applied to individual runs.
  score_fields:
  - {key: basket_count, label: Objects in both baskets}
  - {key: time_bonus_eligible, label: Time-bonus prerequisites met}
  previews:
    gate: {depth: 0.75}
    bins: {depth: 0.55, camera: dfc}
    table: {depth: 0.55, camera: dfc}
  run_inspections:
  - {label: Inspect launcher, target: Payloads}
  - {label: Inspect claw, target: Claw}
  - {label: Inspect lights, target: magnet_target1}
  status_fields:
  - {key: role, label: Role (gate side taken)}
  - {key: intended_role, label: Coin-flip role}
  - {key: heading_bonus, label: Heading coin bonus}
  - {key: role_bonus, label: Role coin bonus (gate side = coin-flip role)}
  actions: []
