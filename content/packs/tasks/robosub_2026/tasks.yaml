# Task pack = task include files + run rules + assets; runtime scoring is executed by nereus.task_runtime + hooks/rules_2026.py.
# No course layout (scenario-owned) and no robot names (capabilities by mechanism type only).
kind: tasks
id: robosub_2026
description: RoboSub 2026 course tasks and scoring (Survey & Repair / Search & Rescue roles).
# Step-3 camera assets for defined tasks; copied byte-for-byte (cp) from riptide_gui riptide_meshes/meshes/.
# Verified at copy time (2026-09-29): riptide_gui HEAD == 907c9ded53b0cd6fe7461d8d80c40a4fa9fbc4fc and
# `git status --porcelain` clean for meshes/{gate,gate_repair,gate_rescue,torpedo}. Step-4 additions
# (slalom, bin, bin_magnet, bin_vinyl, octagon_*) were copied the same way and verified at the same HEAD;
# slalom/old.dae is not used by the original markers and is not copied. DAE texture <init_from>
# basenames resolve next to each model.dae (gate has no textures). Import rules to keep:
# Assimp Collada IGNORE_UP_DIRECTION=true, node hierarchy, white texture tint, pack-relative textures.
assets:
- {id: gate_mesh, path: assets/gate/model.dae}
- {id: gate_repair_mesh, path: assets/gate_repair/model.dae}
- {id: gate_repair_texture, path: assets/gate_repair/Task1_SurveyRepair_Fixed.png}
- {id: gate_rescue_mesh, path: assets/gate_rescue/model.dae}
- {id: gate_rescue_texture, path: assets/gate_rescue/Task1_SearchRescue_Fixed.png}
- {id: torpedo_mesh, path: assets/torpedo/model.dae}
- {id: torpedo_texture, path: assets/torpedo/Task4_ver1_Fixed.png}
# Step-4 table collision meshes (PyBullet CPU prop world); copied byte-for-byte with cp.
- {id: table_mesh, path: assets/table/table.obj}
- {id: basket_helmet_mesh, path: assets/table/table_basket_helmet.obj}
- {id: basket_warning_mesh, path: assets/table/table_basket_warning.obj}
- {id: pill_mesh, path: assets/table/table_pill.obj}
- {id: bandage_mesh, path: assets/table/table_bandage.obj}
- {id: nut_and_bolt_mesh, path: assets/table/table_nut_and_bolt.obj}
