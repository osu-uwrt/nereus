  category: task
  required_from_step: 4
  blocker: no acoustic source placement or amplitude model exists (robot pending pinger, O3/O4)
  known: {subtree: RandomPingerTree, hook: pinger_first/pinger_second tied to first scored deploy/restore row}
- id: return_home
  category: task
  required_from_step: 4
  blocker: only needs hook logic; geometry is gate.reverse_pass
  known: {subtree: ReturnHomeTree, hook: home 300 when eligible and envelope top below surface}
- id: prep_and_dive
  category: task
  required_from_step: 2
  blocker: bridge wiring only; no scoring
  known: {subtrees: [PrepForRun, WaitForKillSwitch, Dive], bridge: [software_kill, firmware_kill, reload, arm]}
