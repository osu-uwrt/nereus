tasks: [gate.yaml, torpedo.yaml]   # pack-relative task include files (kind task)

# Robot capabilities by mechanism TYPE (never robot id); checked at scenario resolution.
requires:
- {task: torpedo, mechanism_type: launcher, min_count: 1}

# Run options (competition.yaml ui.run_options defaults; pinger_select run command).
run_options:
- {key: role, type: choice, choices: [repair, rescue], default: repair}
- {key: heading_coin, type: bool, default: true}
- {key: role_coin, type: bool, default: true}
- {key: pinger_task, type: choice, choices: [none, deploy, restore], default: none}
- {key: pinger_random, type: bool, default: false}

# Exact 2026 stateful rules (RunScore + CourseJudge). Declaration only; body is step 4.
# Pure function of (immutable run state, ordered events since last call) -> (score row changes,
# new events). No runtime object, no stepping, no ROS. validate never imports it.
scoring_hooks:
- module: hooks.rules_2026            # pack-relative hooks/rules_2026.py, NOT created in step 1
  function: evaluate
  parameters:
    roles:
      repair: {target_class: fire, facing_icons: [compass, hammer_and_wrench]}
      rescue: {target_class: blood, facing_icons: [buoy, sos]}
    award_policy: max_per_row              # RunScore.award: a row only increases
    eligibility: gate_passed_and_not_ended # except the gate row and shot registration
    gate:
      role_reference_frame: gate_repair    # repair iff crossing y has the sign of this frame's y
      style: {quarter_rad: 1.5707963267948966, epsilon_rad: 1.0e-6, max_quarters: 8, roll_pitch_first: true}
    torpedo:
      good_results: [success, wrong_target]  # both count for per-shot points
      sequence_order: [large, small]         # launch order, both correct class
      release_distance: {task: torpedo, measure: abs_local_x_of_projectile_tip}
    points:   # config/scoring.yaml, verbatim
      pinger_first: 500
      pinger_second: 1500
      gate: 100
      heading: 300
      role: 150
      slalom_same: 400
      slalom_other: 200
      slalom_depth: 200
      bin: 300
      bin_class: 500
      torpedo: 600
      distance_far: 400
      distance_near: 200
      distance_far_m: 0.4572
      distance_near_m: 0.3048
      sequence: 1400
      light: 500
      max_lights: 2
      max_shots: 2
      object_drop: 200
      basket_correct: 700
      basket_other: 500
      surface: 800
      object_surface: 400
      facing_correct: 400
      facing_other: 200
      facing_count: 700
      basket_count: 1000
      basket_count_near: 500
      home: 300
      style_rp: 200
      style_yaw: 100
      max_style_quarters: 8
    tolerances:   # config/tasks.yaml scoring (simulator tolerances, not handbook rules)
      breach_margin_m: 0.02
      surface_dwell_s: 0.5
      facing_tolerance_deg: 15.0
      facing_dwell_s: 0.5
      turn_tolerance_deg: 30.0
      turn_dwell_s: 1.0
      turn_settle_deg: 10.0
      turn_reversal_deg: 15.0

# Inactive: remaining RepairCompTree subtrees, recorded so the step-4 schema does not churn.
pending:
- id: slalom
  category: task
  required_from_step: 4
  blocker: task definition not written in step 1
  known:
    subtree: SlalomTree
    region: {type: rectangular_portal, count: 3, frames: [slalom_front, slalom_middle, slalom_back],
             abs_y_lt_m: 1.55, z_band_m: [-0.81, 0.474], traversal: reference_origin,
             note: side = sign(y); depth uses envelope extent}
    props: slalom/model.dae visual only; the original has NO pole collision proxies
    hook: rows scored vs gate side (same/other) + depth bonus
- id: random_pinger
  category: task
  required_from_step: 4
  blocker: no acoustic source placement or amplitude model exists (robot pending pinger, O3/O4)
  known: {subtree: RandomPingerTree, hook: pinger_first/pinger_second tied to first scored deploy/restore row}
- id: bins
  category: task
  required_from_step: 4
  blocker: task definition not written in step 1
  known:
    subtree: BinTree
    crates: {frames: [bin_vinyl1, bin_vinyl2, bin_vinyl3, bin_vinyl4], classes: [blood, fire, fire, blood],
             outer_width_m: 0.333248, inner_width_m: 0.3048, outer_height_m: 0.2794,
             base_thickness_m: 0.008128, liner_thickness_m: 0.004, liner_height_fraction: 0.5}
    magnet_lights: {frames: [magnet_target1, magnet_target2], face_rpy_rad: [0, -0.7853981633974483, 0],
                    sensor_offset_m: [-0.008, 0, 0], trigger_distance_m: 0.1524, activation_time_s: 0.5,
                    initial: red, latched: green}
    events: drop_into applies to ALL payload kinds (T15); magnet proximity dwell
    hook: bins 300 per good + 500 per unique correct; lights 500 each, max 2
- id: table
  category: task
  required_from_step: 4
  blocker: task definition not written in step 1; original props used PyBullet (T9)
  known:
    subtree: NewTableTree
    static_collision: [table.obj, table_basket_helmet.obj, table_basket_warning.obj]
    slab: {size_m: [0.635, 0.635, 0.01905], center_m: [0, 0, -0.009525]}
    props: {ids: [pill, bandage, nut_and_bolt, plug], mass_kg: [0.12, 0.10, 0.12, 0.10],
            volume_m3: [9.0e-05, 7.0e-05, 9.0e-05, 7.0e-05], basket: [helmet, helmet, warning, warning]}
    events: [attach, drop_into, surface]
    hook: object drop, baskets, basket-count turns
- id: surface
  category: task
  required_from_step: 4
  blocker: task definition not written in step 1
  known:
    subtree: SurfaceTree
    region: {type: surface, shape: regular_octagon, apothem_m: 1.3716, pipe_radius_m: 0.010668, surface_z_m: 0.0}
    props: octagon PVC (8 boxes) and signs compass, hammer_and_wrench, buoy, sos
    events: breach outside octagon ends scoring; surface dwell 0.5 s; facing within 15 deg for 0.5 s
- id: return_home
  category: task
  required_from_step: 4
  blocker: only needs hook logic; geometry is gate.reverse_pass
  known: {subtree: ReturnHomeTree, hook: home 300 when eligible and envelope top below surface}
- id: prep_and_dive
  category: task
  required_from_step: 2
  blocker: bridge wiring only; no scoring
  known: {subtrees: [PrepForRun, WaitForKillSwitch, Dive], bridge: [software_kill, firmware_kill, reload, arm]}
