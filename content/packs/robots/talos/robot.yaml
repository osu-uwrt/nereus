# Robot-level safety state. Original: physics_simulator.cpp enabled=false at startup; kill clears
# thruster queues (stopThrusters) and task node disarms actuators (mechanisms.py kill()).
safety:
  initially_killed: true
  kill_stops_thrusters: true          # queued commands cleared, realized force coasts down
  commands_while_killed: zero_force   # original forceCallback queues a zero vector when disabled
  kill_disarms_mechanisms: true
  arming:                             # one shared armed flag (mechanisms.py)
    initially_armed: false
    arm_rejected_while_killed: true
    applies_to: [torpedo_launcher, dropper, claw]

# Sensors inline the native model parameters (no external profile refs). period_ns on the 2 ms lattice.
sensors:
- id: imu
  type: ahrs
  frame: imu_mount
  mount_frame: imu_mount
  period_ns: 20000000        # 50 Hz, simulator.yaml sensor_properties.imu_rate
  latency_ns: 0
  parameters:
    inertial:
      acceleration_noise: {white_stddev: [0.016, 0.016, 0.016]}                      # m/s^2
      gyro_noise: {white_stddev: [0.00017453292519943296, 0.00017453292519943296, 0.00017453292519943296]}   # 0.01 deg/s
      reporting:
        gravity_magnitude_m_s2: 9.755455    # matches EKF gravitational_acceleration; plant uses 9.80665
        force_variance: [0.01, 0.01, 0.01]
        angular_variance: [0.01, 0.01, 0.01]
    attitude:
      angle_stddev_rad: 0.008726646259971648   # 0.5 deg random-axis scalar angle
      heading_drift_rad_s: 0.0                 # sensors.yaml imu_yaw_drift 0 overrides talos.yaml 1.5 deg/min
      reported_variance: [5.0e-05, 1.0e-05, 0.01]
- id: fog
  type: fog
  frame: fog_mount
  mount_frame: fog_mount
  period_ns: 2000000         # 500 Hz gyro_rate
  latency_ns: 0
  parameters:
    axes: [[0, 0, 1]]
    gyro_noise: {white_stddev: [0, 0, 0.00017453292519943296]}
    reported_variance: [0, 0, 3.0461741978670866e-08]
- id: dvl
  type: reference_velocity
  frame: dvl_mount
  mount_frame: dvl_mount
  period_ns: 125000000       # 8 Hz; lattice rounds to 126/250/376 ms (native doc)
  latency_ns: 0
  parameters:
    reference_velocity_world_m_s: [0, 0, 0]
    velocity_noise: {white_stddev: [0.001, 0.001, 0.001]}
    reported_variance: [1.0e-06, 1.0e-06, 1.0e-06]
    # dvl_max_tilt default 0 => never loses lock; no range product (original default).
- id: depth
  type: reference_altitude
  frame: world
  mount_frame: depth_mount
  period_ns: 50000000        # 20 Hz
  latency_ns: 0
  parameters:
    target_position_body_m: [0.016999999999999987, -0.010000000000000002, -0.041999999999999996]   # base_link in COM frame
    noise: {white_stddev: 0.01}
    reported_variance: 0.0001
- id: ffc
  type: stereo_camera          # Stage 3; offscreen renderer-owned acquisition
  frame: ffc_left_optical
  mount_frame: ffc_mount
  enabled: true                # offscreen acquisition, independent of viewer subscriptions
  period_ns: 66666667          # grab_frame_rate 15 Hz (ffc_config.yaml); lattice rounds to 66/134 ms
  latency_ns: 0
  parameters:
    # Rectified stereo parameters (calibration tirpak_ffc_charuco_3.yaml, Size 1920x1200 == resolution_px, no scaling).
    # Method: cv2.stereoRectify(K_LEFT, D_LEFT, K_RIGHT, D_RIGHT, Size, R, T, CALIB_ZERO_DISPARITY, alpha 0), as
    # camera_faker camera.hpp:131 (call) and 145-148 (fx,fy,cx,cy = P[0,0],P[1,1],P[0,2],P[1,2]); OpenCV 4.10.0.
    # P1 and P2 share fx,fy,cx,cy, so both intrinsics_* are the rectified values. Baseline = -P2[0,3]/P2[0,0]
    # = 49.75591649077412 mm (calibration T is in mm, |T| = 49.7559 mm); talos.yaml nominal baseline was 0.050 m.
    # Published CameraInfo uses these rectified values with zero distortion.
    # Raw K_LEFT  = fx 1701.5228274850651, fy 1702.38974652801, cx 935.1500437132862, cy 579.3540600385955
    # Raw K_RIGHT = fx 1698.3287694267367, fy 1699.664166238939, cx 944.3162080348961, cy 590.0641457266676
    # Raw D_RIGHT = [0.2759779552328478, -0.008533485244699875, 0.0, 0.0, -0.868687260703704]
    baseline_m: 0.04975591649077412
    right_frame: ffc_right_optical   # right-eye outputs are supported but not listed: the original published left only
    resolution_px: [1920, 1200]      # HD1200 grab_resolution
    intrinsics_left: {fx: 1863.9341697853888, fy: 1863.9341697853888, cx: 955.8471374511719, cy: 584.7962646484375}
    intrinsics_right: {fx: 1863.9341697853888, fy: 1863.9341697853888, cx: 955.8471374511719, cy: 584.7962646484375}
    distortion_left_plumb_bob: [0.2678975458895328, 0.060526966446929266, 0.0, 0.0, -1.0363393179270073]   # raw calibration metadata only; rectified outputs publish zero D (O5)
    outputs: [rgb_left, depth_left, camera_info]
    depth:
      min_range_m: 0.15
      max_range_m: 4.0         # ffc_config depth.max_depth and cameras.yaml depth_model.max_range
      noise: {base_sigma_m: 0.002, range_coefficient: 0.0015, range_exponent: 2.0, bias_m: 0.0,
              dropout: 0.005, range_dropout: 0.10, edge_dropout: 0.20, outliers: 0.002,
              correlation: 0.5, patch_size_px: 8}   # camera_faker/config/cameras.yaml depth_model
- id: dfc
  type: stereo_camera
  frame: dfc_left_optical
  mount_frame: dfc_mount
  enabled: true                # offscreen acquisition, independent of viewer subscriptions
  period_ns: 66666667          # 15 Hz
  latency_ns: 0
  parameters:
    # Rectified stereo parameters (calibration dfc_charuco_test.yaml, Size 1920x1200 == resolution_px, no scaling).
    # Method: cv2.stereoRectify(K_LEFT, D_LEFT, K_RIGHT, D_RIGHT, Size, R, T, CALIB_ZERO_DISPARITY, alpha 0), as
    # camera_faker camera.hpp:131 (call) and 145-148 (fx,fy,cx,cy = P[0,0],P[1,1],P[0,2],P[1,2]); OpenCV 4.10.0.
    # P1 and P2 share fx,fy,cx,cy, so both intrinsics_* are the rectified values. Baseline = -P2[0,3]/P2[0,0]
    # = 50.30758651145167 mm (calibration T is in mm, |T| = 50.3076 mm); talos.yaml nominal baseline was 0.045 m.
    # Published CameraInfo uses these rectified values with zero distortion.
    # Raw K_LEFT  = fx 1708.5053974906311, fy 1678.9579416970594, cx 955.8252400838678, cy 616.5398589377248
    # Raw K_RIGHT = fx 1714.2065310272428, fy 1680.0645526326848, cx 964.2105180096831, cy 594.2566643655323
    # Raw D_RIGHT = [0.2358914896564815, -0.11300807135219121, -0.0010622670919948295, 0.00937432162663741, 0.0]
    baseline_m: 0.05030758651145167
    right_frame: dfc_right_optical
    resolution_px: [1920, 1200]
    intrinsics_left: {fx: 1857.5388723099845, fy: 1857.5388723099845, cx: 974.8830642700195, cy: 604.2220611572266}
    intrinsics_right: {fx: 1857.5388723099845, fy: 1857.5388723099845, cx: 974.8830642700195, cy: 604.2220611572266}
    distortion_left_plumb_bob: [0.23711268288264142, -0.14781371703855056, -0.0006042261836638719, 0.0013987545571711227, 0.0]   # raw calibration metadata only
    outputs: [rgb_left, depth_left, camera_info]
    depth:
      min_range_m: 0.15
      max_range_m: 4.0         # dfc_config has no max_depth; camera_faker shared depth_model max_range
      noise: {base_sigma_m: 0.002, range_coefficient: 0.0015, range_exponent: 2.0, bias_m: 0.0,
              dropout: 0.005, range_dropout: 0.10, edge_dropout: 0.20, outliers: 0.002,
              correlation: 0.5, patch_size_px: 8}

# Payload/claw physical parameters: talos_tasks.yaml (== robots/talos/config/equipment.yaml values).
mechanisms:
- id: torpedo_launcher
  type: launcher
  frame: torpedoes_mount
  parameters:
    # Slot pose in torpedoes_mount = T(0, -/+ baseline/2, 0) * slot_offset; baseline 0.0365125 m
    # (talos.yaml torpedoes.baseline). Precomputed here; nose = slot +X. Fire order slot_0, slot_1.
    slots:
    - {id: slot_0, position_m: [0.01594921, -0.02560642, -0.0218555], orientation_wxyz: [1, 0, 0, 0]}
    - {id: slot_1, position_m: [0.01594921, 0.00939685, -0.0218555], orientation_wxyz: [1, 0, 0, 0]}
    projectile:
      model: finned_rigid_body       # original advance_rotating (payload_model.py)
      length_m: 0.08299993
      radius_m: 0.013
      mass_kg: 0.01222
      displaced_volume_m3: 1.2e-05
      added_mass_kg: 0.003
      drag_axial: 0.015
      drag_lateral: 0.35
      center_of_mass_m: 0.02         # axial, +X nose, from mesh center
      center_of_buoyancy_m: -0.02
      center_of_drag_m: -0.025
      angular_damping_n_m_s: 0.01
      neutral_buoyancy: false
      max_age_s: 30                  # task_simulator step(): timeout miss
    launch: {spring_energy_j: 0.047}   # v = sqrt(2E/(m+added_mass)) + vehicle point velocity
    cooldown_s: 0.5
    cooldown_group: payload_release  # original single busy_until shared by torpedo AND dropper (T4)
    capacity: 2
- id: dropper
  type: dropper
  frame: droppers_mount
  parameters:
    # Centers in droppers_mount; source rpy [0, pi/2, 0] = quaternion [cos(pi/4), 0, sin(pi/4), 0]
    # points the nose (+X) down. No baseline term (T5).
    slots:
    - {id: slot_0, position_m: [-0.04337956, -0.01560642, -0.12296563], orientation_wxyz: [0.7071067811865476, 0, 0.7071067811865476, 0]}
    - {id: slot_1, position_m: [-0.04337956, 0.01939685, -0.12296563], orientation_wxyz: [0.7071067811865476, 0, 0.7071067811865476, 0]}
    projectile:
      model: fixed_axis_body         # original advance(): no COM/COB offsets => non-rotating integrator
      length_m: 0.08299993
      radius_m: 0.013
      mass_kg: 0.01488
      displaced_volume_m3: 1.2e-05
      added_mass_kg: 0.003
      drag_axial: 0.015
      drag_lateral: 0.35
      neutral_buoyancy: false
      max_age_s: 30
    launch: {spring_energy_j: 0.047}
    cooldown_s: 0.5
    cooldown_group: payload_release
    capacity: 2
- id: claw
  type: claw
  frame: claw_pinch
  parameters:
    min_gap_m: 0.0012
    max_gap_m: 0.14
    jaw_speed_m_s: 0.033             # per jaw
    hold_force_n: 12.0
    friction: 1.2
    contact_margin_m: 0.001
    grasp_dwell_s: 0.04
    slip_distance_m: 0.025
    pads: {left: claw_pad_left, right: claw_pad_right}   # asset ids (convex contact representation)
    timed_command: signed_duration   # >0 open for |d| s, <0 close for |d| s, 0 stop (mechanisms.py claw_timed)
    initial_state: closed            # claw_world.py _reset_bodies: q=0, target=0 => gap = min_gap
    # Original props/pads run in a private PyBullet world (claw_world.py); see trap T9.
- id: magnet
  type: magnet
  frame: magnet_mount
  parameters:
    tip_position_m: [0, 0, 0.05]     # talos_tasks.yaml magnet_lights.robot_tip_offset, in magnet_mount
    actuated: false                  # passive; proximity is judged by the task pack

# Geometry the task pack uses for pass-through/breach/surface tests (task_simulator CourseJudge):
# all 8 corners of every collision box, plus the magnet tip point.
scoring_envelope:
  collision_boxes: [hull_0, hull_1]
  points:
  - {id: magnet_tip, frame: magnet_mount, position_m: [0, 0, 0.05]}

# Inactive, not instantiated. Recorded so later steps do not re-derive source facts.
pending:
- id: pinger
  category: sensor
  proposed_type: acoustic_amplitude
  required_from_step: 4
  blocker: >-
    No original amplitude model, stream rate or acoustic source positions exist (O3). RandomPingerTree
    needs /talos/ivc/pinger/selected_freq_amp_stream (std_msgs/Float32) whose two 10 s window averages
    decide the task order. Blocks the random_pinger subtree only.
  known:
    frame: hydrophone_port                 # hydrophone frames are already active frames above
    other_frames: [hydrophone_starboard]
    default_frequency_khz: 30              # pinger_broker.cpp; frequency input ivc/pinger/set_freq_khz Int32
    speed_of_sound_m_s: 1500               # talos.yaml acoustics
    consumer: riptide_acoustics Acoustics.cpp (avg mode)
