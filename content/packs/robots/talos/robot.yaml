# Offscreen-camera meshes at their initial (reset) configuration; no animation state here.
#  - Body and rotors: camera_faker main.cpp:661-663 draws robot objects at body * modelOffset * robotMount, where
#    modelOffset = baseToOrigin (camera.hpp:33-35, the `cad` frame) and a rotor's robotMount is its spin about its
#    pivot (thruster_visuals.hpp:15-19), identity at angle 0. Vertices are authored in the CAD origin.
#  - Claw: renderer.cpp:488-501 loads the five claw meshes at identity; renderer.cpp:652-663 clawPose draws
#    mount * translate(0, +left | -right, 0), with mount = task claw.pose when present (main.cpp:493-494;
#    talos_tasks.yaml claw.pose = frame claw_pinch). Jaw joints start at 0 (main.cpp:496, 869) and 0 is closed:
#    claw_world.py q = 0 at reset, gap = min_gap (_reset_bodies, command: target 0 closes). So every claw mesh
#    is at identity in claw_pinch. Carriers/pads opening travel belongs to the mechanism runtime.
