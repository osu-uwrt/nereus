# Talos on the RoboSub 2026 course. Pack paths are relative to this folder; the scenario owns
# everything run-specific: world frame, placements, initial state, seed and run options.
kind: scenario
id: talos_uwrt_repair_2026
description: Talos and the UWRT stack on the RoboSub 2026 course.

robot: ../../robots/talos
pool: ../../pools/robosub_2026
tasks: ../../tasks/robosub_2026
bridge: ../../bridges/uwrt_talos
equipment: ../../equipment/uwrt

seed: 7
timestep_s: 0.002   # physics step
sensor_noise: true

# World = the robot's `map` frame: ENU, +Z up, z = 0 at the water surface. Placements are
# upright (yaw about world +Z only).
world_frame: map

# Pool corner pose in the world.
pool_placement:
  position_m: [0.0, 19.5136, 0.0]
  yaw_deg: -90.0

# The calibration board on the pool's y = 0 side wall at the map origin, datum line at the waterline.
equipment_placements:
- {item: calibration_board, relative_to: pool, position_m: [19.5136, 0.0, -0.3394], yaw_deg: 90.0}

# Task poses, matching the robot's prior map (riptide_mapping2 config.yaml).
task_placements:
- {task: gate, position_m: [4.810167, -2.217889, -0.75], yaw_deg: 170.645069}
- {task: torpedo, position_m: [18.35222, 2.480545, -1.372], yaw_deg: -169.835651}
- {task: slalom, position_m: [8.332382, 0.560795, -1.3], yaw_deg: -152.691724}
- {task: bins, position_m: [13.408019, 12.324713, -2.13], yaw_deg: -145.070841}
# The octagon sits above the table.
- {task: surface, position_m: [19.35704644774681, 9.087985574042571, -0.3048], yaw_deg: -45.273547}
- {task: table, position_m: [19.290761, 9.007, -1.54], yaw_deg: 89.039804}

contacts:
  model: box_scene
  restitution: 0.1
  friction: 0.4

# Start state of the center of mass (body-axis velocities). Kill/arm defaults come from
# robot.safety.
initial:
  frame: com
  position_m: [0, 0, -1]
  orientation_wxyz: [1, 0, 0, 0]
  linear_velocity_m_s: [0, 0, 0]
  angular_velocity_rad_s: [0, 0, 0]

run:
  auto_start: false   # a run starts on the operator's Start
  options: {role: repair, heading_coin: true, role_coin: true, pinger_task: none, pinger_random: false}
