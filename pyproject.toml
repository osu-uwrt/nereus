[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nereus"
version = "0.1.0"
description = "Nereus pack tools: validate and resolve robot, pool, task, bridge and scenario packs; plan and export synthetic datasets"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.23,<3", "ruamel.yaml>=0.18,<0.20",
                "jsonschema>=4.21,<5", "referencing>=0.34,<1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.11,<2", "ruff>=0.9,<1", "pytest>=7"]
# Synthetic dataset export/preview (OpenCV) and the part-mask tool (Pillow, SciPy).
datasets = ["opencv-python-headless>=4.6,<5", "Pillow>=9", "scipy>=1.8"]

[project.scripts]
nereus-packs = "nereus.packs.__main__:main"
nereus-dataset = "nereus.datasets.__main__:main"

[tool.setuptools.packages.find]
where = ["python/src"]

[tool.setuptools.package-data]
nereus = ["py.typed"]
"nereus.packs" = ["definitions/*.json"]
"nereus.datasets" = ["definitions/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["ruamel.*", "jsonschema.*", "cv2", "cv2.*"]
ignore_missing_imports = true
