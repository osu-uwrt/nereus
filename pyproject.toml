[build-system]
requires = ["scikit-build-core>=0.11,<1.1", "pybind11>=2.13,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "robotics-platform"
version = "0.1.0"
description = "Standalone underwater simulation and typed sensor runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.md"}
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3"]
dependencies = ["numpy>=1.23,<3", "ruamel.yaml>=0.18,<0.20",
                "jsonschema>=4.21,<5", "referencing>=0.34,<1"]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.11,<2", "ruff>=0.9,<1",
       "scikit-build-core>=0.11,<1.1", "pybind11>=2.13,<4", "ninja>=1.5"]

[tool.scikit-build]
minimum-version = "0.11"
cmake.version = ">=3.22"
build-dir = "build/python/{wheel_tag}"
build.tool-args = ["-j2"]
wheel.packages = []
install.components = ["python"]
sdist.include = ["bindings/**", "python/**", "libraries/**", "cmake/**", "content/examples/**", "content/robots/**", "content/sensors/**", "content/worlds/**", "content/packs/**", "tests/**", "examples/**", "tools/**", "docs/**", "/CMakeLists.txt", "/LICENSE.md", "/README.md"]
sdist.exclude = ["content/visuals/**", "build/**", "install/**", "dist/**", ".cache/**", "**/__pycache__/**"]

[tool.scikit-build.cmake.define]
RP_BUILD_PYTHON = "ON"
RP_BUILD_CLI = "OFF"
BUILD_TESTING = "OFF"
BUILD_SHARED_LIBS = "OFF"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["ruamel.*", "jsonschema.*"]
ignore_missing_imports = true
